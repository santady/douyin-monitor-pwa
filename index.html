/* ============================================================================
   Web 前端共享核心（2026-11-11 抽）

   只放三处页面（/dy、/xhs、App）真正重复的纯逻辑与展示工具：

   别把平台差异塞进这个文件，否则又会变成三份同构代码。

   ★ 唯一手改入口就是本文件。
     改完后运行：python tools/build_frontend.py
     三个页面里的 __FRONTEND_CORE_START__ / __FRONTEND_CORE_END__ 之间会被重写。
     CI 跑 --check，页面里的生成块和本文件不一致就红。

function esc(s){
  return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({
    '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;'
  })[c]);
}

/* 趋势导出图：把画布装进一张有背景、有标题/日期/图例的完整图片。
   背景必须显式填色，否则 canvas 透明，用户打开就是棋盘格；右侧轴标签也不会被裁。 */
function trendExportCanvasCore(chart, opts){
  opts = opts || {};
  const W = opts.width || 1600;
  const H = opts.height || 920;
  const dpr = opts.dpr || 2;
  const padX = opts.padX || 56;
  const headerH = opts.headerH || 158;
  const footerH = opts.footerH || 44;
  const chartW = opts.chartW || (W - padX * 2);
  const chartH = opts.chartH || (H - headerH - footerH);
  const root = getComputedStyle(document.documentElement);
  const css = k => (root.getPropertyValue(k) || '').trim();
  const bg = opts.bg || css('--panel') || '#ffffff';
  const ink = opts.ink || css('--ink') || '#17243a';
  const mute = opts.mute || css('--mute') || '#8391a6';
  const line = opts.line || css('--line') || '#e3eaf3';
  const accent = opts.accent || css('--accent') || '#2f6feb';
  const ff = (css('--sans') || 'sans-serif').replace(/\s+/g, ' ');
  const cv = document.createElement('canvas');
  cv.width = Math.round(W * dpr); cv.height = Math.round(H * dpr);
  const g = cv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);
  g.fillStyle = bg; g.fillRect(0, 0, W, H);
  g.fillStyle = accent; g.fillRect(0, 0, W, 3);

  const fit = (text, maxW) => {
    let s = String(text == null ? '' : text);
    if(g.measureText(s).width <= maxW) return s;
    while(s.length > 1 && g.measureText(s + '…').width > maxW) s = s.slice(0, -1);
    return s + '…';
  };

  g.textAlign = 'left'; g.textBaseline = 'alphabetic';
  g.fillStyle = accent; g.font = '600 12px ' + ff;
  g.fillText(fit(opts.kicker || '', W - padX * 2), padX, 34);
  g.fillStyle = ink; g.font = '700 30px ' + ff;
  g.fillText(fit(opts.title || '趋势', W - padX * 2), padX, 68);
  g.fillStyle = mute; g.font = '500 13px ' + ff;
  g.fillText(fit(opts.subtitle || '', W - padX * 2), padX, 92);

  g.strokeStyle = line; g.lineWidth = 1;
  g.beginPath(); g.moveTo(padX, 106); g.lineTo(W - padX, 106); g.stroke();

  let lx = padX;
  const ly = 132;
  g.font = '500 12px ' + ff;
  (opts.legend || []).forEach(item => {
    if(!item || !item.name) return;
    const name = item.name;
    const tw = Math.min(250, g.measureText(name).width);
    if(lx + 20 + 6 + tw > W - padX) return;
    g.strokeStyle = item.color || ink;
    g.lineWidth = 2;
    g.setLineDash(item.dash ? [5, 4] : []);
    g.beginPath(); g.moveTo(lx, ly - 4); g.lineTo(lx + 20, ly - 4); g.stroke();
    g.setLineDash([]);
    if(!item.dash){
      g.fillStyle = item.color || ink;
      g.beginPath(); g.arc(lx + 10, ly - 4, 2.2, 0, Math.PI * 2); g.fill();
    }
    g.fillStyle = ink;
    g.fillText(fit(name, 250), lx + 26, ly);
    lx += 26 + tw + 26;
  });

  g.drawImage(chart, padX, headerH, chartW, chartH);

  g.strokeStyle = line; g.lineWidth = 1;
  g.beginPath(); g.moveTo(padX, H - footerH + 8); g.lineTo(W - padX, H - footerH + 8); g.stroke();
  g.fillStyle = mute; g.font = '500 11px ' + ff;
  g.fillText(fit(opts.footer || '', W - padX * 2 - 140), padX, H - 18);
  if(opts.stamp){
    g.textAlign = 'right';
    g.fillText(fit(opts.stamp, 240), W - padX, H - 18);
    g.textAlign = 'left';
  }
  return cv;
}


function hexA(hex, a){
  const h = hex.replace('#','');
  const n = parseInt(h.length === 3 ? h.split('').map(c=>c+c).join('') : h, 16);
  return `rgba(${(n>>16)&255},${(n>>8)&255},${n&255},${a})`;
}

function qoqPctTxt(v){
  if(v == null) return '—';
  const a = Math.abs(v);
  return (v >= 0 ? '+' : '−') + a.toFixed(a === Math.round(a) ? 0 : 1) + '%';
}
function qoqTxt(t){
  return qoqPctTxt(t.qoq);
}

/* 桌面 /dy、/xhs 的「无环比」class 是 na，App 是 flat；本体只差这一处 */
function fmtQoqCore(t, naClass){
  const c = t.qoq == null ? naClass : (t.qoq >= 0 ? 'up' : 'down');
  return '<i class="qoq ' + c + '" title="' + esc(qoqTip(t)) + '">' + qoqTxt(t) + '</i>';
}

function spanNote(h){
  if (h == null || Math.abs(h - 24) <= 2) return '';
  return '(' + (h < 1 ? Math.round(h * 60) + '分' : h.toFixed(1) + 'h') + ')';
}

/* 桌面页请求 /api/state 时默认不要 spark：列表已经不画迷你曲线，79 个话题的
   24 点数组能省近一半响应体。App 走内置接口，不能带这个查询参数。 */
function statePath(path){
  if(typeof window !== 'undefined' && window.APP_API) return path;
  return path + (path.indexOf('?') >= 0 ? '&' : '?') + 'spark=0';
}

/* ---------------- 列表/仪表盘共用的小工具 ----------------
   两个桌面页各有一份 qoqTip / metricQoq / 表头排序 / 指标切换 / 健康条；
   页面只留薄包装，差异通过参数传进来（App 没有这些容器，不调用即可）。 */
function qoqTipCore(t, fmt){
  if(t.qoq == null)
    return '环比：需要前后两个完整的 24 小时窗口（各 18–30 小时），历史不足先不显示';
  return '环比 ' + qoqTxt(t) + '｜今天 24h ' + fmt(t.d1)
    + '，昨天 24h ' + fmt(t.d1_prev)
    + '，涨跌 ' + fmt(t.qoq_delta)
    + '（窗口跨度 ' + (t.span1 ?? '—') + 'h / ' + (t.span_prev ?? '—') + 'h）';
}

function metricQoqCore(t, fmt, metric){
  const m = metric || tableMetric();
  if(!m.qoqKey || m.qoqKey === 'qoq'){
    return {v:t.qoq, delta:t.qoq_delta, txt:qoqTxt(t), tip:qoqTipCore(t, fmt)};
  }
  const v = t[m.qoqKey], delta = t[m.deltaKey];
  const txt = qoqPctTxt(v);
  return {
    v, delta, txt,
    tip: v == null
      ? m.label + ' 环比：需要前后两个完整窗口，历史不足先不显示'
      : m.label + ' 环比 ' + txt + '｜本段 ' + fmt(t[m.key])
        + '，上一段 ' + fmt(t[m.prevKey])
        + '，涨跌 ' + fmt(delta)
  };
}

function paintTableSort(){
  const s = tableSortState();
  $('#allTopics').querySelectorAll('th[data-k]').forEach(th => {
    const on = th.dataset.k === s.key;
    th.classList.toggle('sorted', on);
    th.setAttribute('aria-sort', on ? (s.dir > 0 ? 'ascending' : 'descending') : 'none');
    const ind = th.querySelector('.sort-ind');
    if(ind) ind.textContent = on ? (s.dir > 0 ? ' ↑' : ' ↓') : '';
  });
}

function applyTableMetricCore(stateObj){
  const m = tableMetric();
  const sel = $('#metricSel');
  if(sel && sel.value !== stateObj.metric) sel.value = stateObj.metric;
  $('#allTopics').querySelectorAll('th[data-metric], #tbody td[data-metric]').forEach(el => {
    el.hidden = el.dataset.metric !== m.key;
  });
  $('#allTopics').querySelectorAll('.span-col').forEach(el => { el.hidden = true; });
  const label = $('#thQoqLabel'), th = $('#thQoq');
  if(label) label.textContent = m.label + ' 环比';
  if(th) th.title = m.tip;
}

function renderDashboardHealthCore(stateObj, platform){
  const box = $('#dashboardHealth'), open = box.querySelector('details')?.open;
  box.innerHTML = dashboardHealthHtml((stateObj.data?.topics || []).map(desktopDashboardRow), platform, {loadError: dashboardLoadError});
  if(dashboardHistoryError) box.innerHTML += '<div class="dashboard-error">' + esc(dashboardHistoryError) + '</div>';
  if(open && box.querySelector('details')) box.querySelector('details').open = true;
}

async function copyText(lines){
  const text = lines.join('\n');
  try{
    await navigator.clipboard.writeText(text);
  }catch(e){
    const ta = document.createElement('textarea');
    ta.value = text; document.body.appendChild(ta); ta.select();
    document.execCommand('copy'); ta.remove();
  }
}

/* 两列（参与人数/讨论数）的「上一个时间窗口」增量；两端都必须真带第三列 */
function usersBefore(snaps, hours){
  if (!snaps || snaps.length < 2) return [null, null];
  const last = snaps[snaps.length - 1];
  if (last.length < 3 || last[2] == null) return [null, null];
  const target = last[0] - hours * 3600;
  let b = null;
  for (let i = 0; i < snaps.length - 1; i++){
    const s = snaps[i];
    if (s.length < 3 || s[2] == null) continue;
    if (b === null || Math.abs(s[0] - target) < Math.abs(b[0] - target)) b = s;
  }
  if (!b || b[0] >= last[0]) return [null, null];
  return [last[2] - b[2], (last[0] - b[0]) / 3600];
}

/* 长档横轴：按本地 0 点切天，每天一格 */
function dayTicks(t0, t1){
  const d = new Date(t0 * 1000);
  const mid = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 1000;
  const out = [];
  for(let t = mid + Math.ceil((t0 - mid) / 86400) * 86400; t <= t1 + 1; t += 86400) out.push(t);
  return out;
}

/* 横轴标签：短档写小时，跨天加日期，长档只写日期；sep 是日期分隔符（桌面 -，App .） */
function xAxisLabelCore(ts, crossDay, dayOnly, sep){
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
  const md = p(d.getMonth() + 1) + (sep || '-') + p(d.getDate());
  if(dayOnly) return md;
  return (crossDay ? md + ' ' : '') + p(d.getHours());
}

/* 柱跨度（2026-11-16 用户定「趋势曲线增加每根柱状图跨度选项」）：
   pref 是下拉值（'auto' / 1 / 2 / 4 / 6 / 12 / 24 小时），返回每根柱代表的秒数。
   auto 沿用原规则：3 天以内按整点小时、7 / 30 天按本地自然日 —— 默认观感不变。 */
function barSpanSecOf(rangeDays, pref){
  if(pref && pref !== 'auto'){
    const h = Number(pref);
    if(h > 0 && h <= 24) return h * 3600;
  }
  return rangeDays > 3 ? 86400 : 3600;
}

/* 柱桶起点：1 小时按整点裁；更长的一律对齐本地 0 点再切 N 小时 / 天，
   否则 2 / 4 / 12 小时的桶会跨天漂移（dayStart 由各页传入，不依赖各自的 localDay）。 */
function bucketStartOf(ts, spanSec, dayStart){
  if(spanSec === 3600) return Math.floor(ts / 3600) * 3600;
  const day = dayStart(ts);
  if(spanSec === 86400) return day;
  return day + Math.floor((ts - day) / spanSec) * spanSec;
}

/* 「图形：柱状 / 曲线」按钮状态；state 需有 mode / shape。默认柱状。 */
function syncShapeCore(state){
  const total = state.mode === 'total';
  const box = document.querySelector('#shapes');
  // 总量口径只能画曲线：即使 state.shape 还是 bar，选中态也要落在「曲线」上。
  if (box) {
    const effective = total ? 'line' : state.shape;
    [...box.children].forEach(b => {
      const isBar = b.dataset.s === 'bar';
      b.disabled = total && isBar;
      b.title = b.disabled ? '总量是累计值，只能画曲线' : '';
      b.classList.toggle('on', b.dataset.s === effective && !b.disabled);
    });
  }
  /* 「柱跨度」只对柱状有用：切到曲线 / 总量时跟着灰掉。
     值不清空 —— 切回柱状时用户之前选的跨度还在。 */
  const span = document.querySelector('#barSpan');
  if (span) span.disabled = total || state.shape === 'line';
}

/* ---------------- 监控台偏好、健康与同名对照（不重算统计） ---------------- */
function dashboardCleanPrefs(prefs){
  const p = prefs && typeof prefs === 'object' && !Array.isArray(prefs) ? prefs : {};
  const out = {
    q: typeof p.q === 'string' ? p.q : '',
    cat: typeof p.cat === 'string' ? p.cat : '',
    sort: ['d1', 'h1', 'qoq', 'total'].includes(p.sort) ? p.sort : 'd1',
  };
  if(['1h', '12h', '24h'].includes(p.metric)) out.metric = p.metric;
  return out;
}

function dashboardPrefs(platform){
  try{
    if(platform !== 'dy' && platform !== 'xhs') return dashboardCleanPrefs(null);
    return dashboardCleanPrefs(JSON.parse(localStorage.getItem('dashboard.prefs.' + platform)));
  }catch(e){ return dashboardCleanPrefs(null); }
}

function saveDashboardPrefs(platform, prefs){
  try{
    if(platform !== 'dy' && platform !== 'xhs') return false;
    localStorage.setItem('dashboard.prefs.' + platform, JSON.stringify(dashboardCleanPrefs(prefs)));
    return true;
  }catch(e){ return false; }
}

function dashboardTopicId(row){
  return String(row == null ? '' : (row.ch_id ?? row.page_id ?? ''));
}

function dashboardNumber(value){
  if(value == null || (typeof value !== 'number' && typeof value !== 'string') ||
      (typeof value === 'string' && !value.trim())) return null;
  const n = Number(value);
  return Number.isFinite(n) ? n : null;
}

function dashboardValue(row){
  return dashboardNumber(row && (row.value ?? row.views));
}

function dashboardTime(ts){
  const n = dashboardNumber(ts), d = n == null ? null : new Date(n * 1000);
  if(!d || !Number.isFinite(d.getTime())) return '未知';
  const p = v => String(v).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth() + 1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}

/* code 仅供健康计数；missing 按「缺指标/基准/时间」计数，不把滞后当成零值。 */
function dashboardIssueDetails(row, platform, now){
  const r = row || {}, out = [];
  const add = (code, text, missing = false) => out.push({code, text, missing});
  const n = dashboardNumber(r.n), ts = dashboardNumber(r.ts);
  const d1 = dashboardNumber(r.d1), span = dashboardNumber(r.span1);
  if(dashboardValue(r) == null) add('empty', '主指标暂无数据：缺少总量快照，原因未知', true);
  if(n === 0) add('history', '暂无历史快照', true);
  else if(n != null && n < 2) add('history', '历史不足：少于 2 条快照，无法形成增量基准', true);
  if(d1 == null) add('d1', '24h 增量缺失：暂无可用基准，不能按 0 处理', true);
  if(span != null && (span < 22 || span > 26))
    add('span', '24h 实际跨度 ' + span + ' 小时' + (span > 30 ? '：跨度过长，存在断档' : '：并非完整 24 小时'));
  if(dashboardNumber(r.qoq) == null)
    add('qoq', dashboardNumber(r.d1_prev ?? r.d1Prev) === 0
      ? '环比缺失：前窗增量为 0，百分比不可计算'
      : '环比缺失：历史、前后窗口跨度或有效基准不足，原因待确认', true);
  if(ts == null || dashboardTime(ts) === '未知') add('time', '主指标采样时间未知', true);
  else if(dashboardNumber(now) != null && now - ts > 3 * 3600)
    add('stale', '采集滞后：该话题主指标超过 3 小时未更新（不等于抓取失败）');
  if(platform === 'xhs'){
    /* 桌面原始 discusses 是笔记数，不冒充 App 网关独立讨论数。 */
    const hasNotes = Object.prototype.hasOwnProperty.call(r, 'discusses');
    const secondary = hasNotes ? r.discusses : (r.discuss ?? r.discuss_count);
    if(dashboardNumber(secondary) == null)
      add('secondary', (hasNotes ? '笔记数' : '讨论数') + '缺失：次指标暂无可用值，原因未知', true);
    if(Object.prototype.hasOwnProperty.call(r, 'discuss_app')){
      if(r.discuss_app_capped) add('discussion', '独立讨论数仅有封顶文案，精确值缺失', true);
      else if(dashboardNumber(r.discuss_app) == null)
        add('discussion', '独立讨论数缺失：暂无可用值，原因未知', true);
      const at = dashboardNumber(r.discuss_app_at);
      if(at != null && dashboardNumber(now) != null && now - at > 3 * 3600)
        add('discussion-stale', '独立讨论数采集滞后：超过 3 小时未更新');
      if(Object.prototype.hasOwnProperty.call(r, 'discuss_app_d1') && dashboardNumber(r.discuss_app_d1) == null)
        add('discussion-d1', '24h 独立讨论数缺失：' + (r.discuss_app_d1_reason || '暂无有效基准'), true);
    }
  }else if(dashboardNumber(r.users) == null)
    add('secondary', '参与人数缺失：次指标暂无可用值，原因未知', true);
  return out;
}

function dashboardRowIssues(row, platform, now = Date.now() / 1000){
  return dashboardIssueDetails(row, platform, now).map(issue => issue.text);
}

function dashboardHealthHtml(rows, platform, options = {}){
  const list = Array.isArray(rows) ? rows : [], opt = options || {};
  const now = opt.now ?? Date.now() / 1000;
  const topics = list.map(row => ({row, issues: dashboardIssueDetails(row, platform, now)}));
  const abnormal = topics.filter(t => t.issues.length);
  const missing = topics.filter(t => t.issues.some(i => i.missing));
  const stale = topics.filter(t => t.issues.some(i => i.code === 'stale' || i.code === 'discussion-stale'));
  const times = list.map(r => dashboardNumber(r && r.ts)).filter(t => t != null && dashboardTime(t) !== '未知');
  const latest = times.length ? times.reduce((a, b) => Math.max(a, b)) : null;
  const label = platform === 'xhs' ? '小红书' : '抖音';
  /* 2026-11-12：原来把五个数字串成一句话，窄屏像一锅粥；改成可换行的胶囊。
     文案仍保留「异常 / 缺数 / 滞后」三个词，测试和排错话术不用换。 */
  const kpi = (name, value, cls) => '<span class="hh-kpi' + (cls ? ' ' + cls : '') +
    '"><i>' + esc(name) + '</i><em>' + esc(value) + '</em></span>';
  let html = '<div class="dashboard-health-summary"><b>' + esc(label) + '健康状态</b>' +
    kpi('最新采样', dashboardTime(latest)) +
    kpi('总话题', String(list.length)) +
    kpi('异常', String(abnormal.length), abnormal.length ? 'warn' : 'ok') +
    kpi('缺数', String(missing.length), missing.length ? 'warn' : '') +
    kpi('滞后', String(stale.length), stale.length ? 'warn' : '') + '</div>';
  if(opt.loadError) html += '<div class="dashboard-error">加载失败：' + esc(opt.loadError) +
    (list.length ? '；保留上次成功数据，尚未刷新' : '；当前数据不可用，监控数量未知') + '</div>';
  if(opt.discussionError) html += '<div class="dashboard-error">讨论数状态：' + esc(opt.discussionError) + '</div>';
  if(!list.length && !opt.loadError) html += '<div>暂无监控话题</div>';
  if(abnormal.length) html += '<details><summary>查看各话题缺数原因（按话题计数，异常与缺数可重叠）</summary><ul>' +
    abnormal.map(({row, issues}) => '<li><b>' + esc(row && (row.name || dashboardTopicId(row))) + '</b>：' +
      issues.map(i => esc(i.text)).join('；') + '</li>').join('') + '</ul></details>';
  return html;
}

/* 独立 xhs_server 的 /api/state 仍是小红书数据，不能当成空的抖音列表。 */
function dashboardStateRows(data, platform){
  const id = platform === 'xhs' ? 'page_id' : 'ch_id';
  if(!data || data.ok === false || !Array.isArray(data.topics)) throw new Error('状态响应无效');
  if(data.topics.some(row => !row || row[id] == null) ||
      (platform === 'dy' && data.meta && Object.prototype.hasOwnProperty.call(data.meta, 'views_sum')))
    throw new Error('另一平台接口不可用：返回的平台不匹配（独立小红书服务不提供抖音状态）');
  return data.topics;
}

function dashboardMatch(rows, name){
  const target = String(name ?? '').trim();
  if(!target) return null;
  let best = null;
  for(const row of rows || []){
    if(!row || String(row.name ?? '').trim() !== target) continue;
    if(best == null || (dashboardValue(row) ?? -Infinity) > (dashboardValue(best) ?? -Infinity)) best = row;
  }
  return best;
}

function dashboardCompareHtml(name, dyRow, xhsRow, errors = {}){

/* ---------------- 桌面两端共用的「本轮采集」表格 ---------------- */
const repNum = v => (v == null || !isFinite(v)) ? null : Number(v);
const repInt = v => v == null ? '—' : Math.round(v).toLocaleString('en-US');
const repVal = (r, ...keys) => { for(const k of keys){ if(r[k] != null) return r[k]; } return null; };
const repClock = ts => {
  if(!ts) return '—';
  const d = new Date(ts * 1000);
  return String(d.getHours()).padStart(2,'0') + ':' + String(d.getMinutes()).padStart(2,'0');
};

function repFilteredCore(REP, cols){
  const q = REP.q.trim().toLowerCase();
  return REP.rows.filter(r => {
    if(REP.cat && !(r.cats || [r.cat || '未分类']).includes(REP.cat)) return false;
    if(q && !String(r.name || '').toLowerCase().includes(q)
        && !(r.cats || [r.cat || '未分类']).join('、').toLowerCase().includes(q)) return false;
    return true;
  }).sort((a, b) => {
    const c = cols.find(x => x.k === REP.sort) || cols[0];
    const va = c.get(a), vb = c.get(b);
    if(va == null && vb == null) return 0;
    if(va == null) return 1;
    if(vb == null) return -1;
    const d = c.type === 'num' ? va - vb : String(va).localeCompare(String(vb), 'zh-CN');
    return d * REP.dir;
  });
}

function repCsvCore(REP, cols, prefix){
  const list = repFilteredCore(REP, cols);
  if(!list.length) return;
  const cell = v => {
    const s = v == null ? '' : String(v);
    return /[",\n]/.test(s) ? '"' + s.replace(/"/g,'""') + '"' : s;
  };
  const lines = [cols.map(c => cell(c.t)).join(',')].concat(
    list.map(r => cols.map(c => { const v = c.get(r); return cell(v == null ? '' : v); }).join(',')));
  const blob = new Blob(['\ufeff' + lines.join('\r\n')], {type:'text/csv;charset=utf-8'});
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = prefix + '本轮采集_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 1000);
}

function repRenderCore(REP, cols, list, ids){
  const tab = document.querySelector(ids.tab);
  const meta = document.querySelector(ids.meta);
  const raw = document.querySelector(ids.raw);
  if(!tab || !raw) return;
  tab.hidden = REP.view !== 'table';
  raw.hidden = REP.view !== 'raw';
  if(REP.view !== 'table') return;
  list = list || repFilteredCore(REP, cols);
  const num = list.length, total = REP.rows.length;
  if(meta) meta.textContent = (num === total ? '共 ' + total + ' 个话题' :
    '显示 ' + num + ' / ' + total + ' 个话题') + (REP.at ? ' · ' + repClock(REP.at) + ' 采集' : '');
  const head = '<thead><tr>' + cols.map(c =>
    '<th data-k="' + c.k + '" class="' + (c.type === 'num' ? 'num ' : '') +
    (REP.sort === c.k ? 'sorted' : '') + '">' + esc(c.t) +
    '<span class="arw">' + (REP.sort === c.k ? (REP.dir < 0 ? '▼' : '▲') : '⇅') + '</span></th>'
  ).join('') + '</tr></thead>';
  const body = list.length ? '<tbody>' + list.map(r => '<tr>' + cols.map(c => {
    const v = c.get(r);
    if(v == null || v === '') return '<td class="' + (c.type === 'num' ? 'num ' : '') + 'nil">—</td>';
    let cls = (c.type === 'num' ? 'num ' : '') + (c.cls || '');
    if(c.delta) cls += v > 0 ? ' up' : (v < 0 ? ' down' : '');
    return '<td class="' + cls + '">' + esc(c.fmt ? c.fmt(v) : v) + '</td>';
  }).join('') + '</tr>').join('') + '</tbody>' : '';
  tab.innerHTML = num ? '<table class="rp-tbl">' + head + body + '</table>'
    : '<div class="rp-empty">没有匹配的话题</div>';
}

/* ==========================================================================
   数据工作台：单话题 / 指定时间段详情（2026-11-13 重做）
   --------------------------------------------------------------------------
   三端共用。上面的纯函数可离线自检；labMount 只在被调用时才碰 DOM。
   数据契约（各端胶水负责准备）：
     { platform:'dy'|'xhs', label:'抖音'|'小红书', unit:'播放量'|'浏览量',
       secondaryLabel:'参与人数'|'笔记数',
       rows:  [ 当前榜单，来自 /api/state 或 App 的 rowsOf() ],
       series:[ {id, name, cat, cats, points:[[ts,value,users?], ...], discussPoints?:[[ts,discuss], ...]} ],
       focusId: 打开时默认选中的话题 ID,
       now:   最新采样 Unix 秒 }
   这里不再做历史回放、多话题对比、结构化导出；只保留一个用途：
   选一个话题、选一个时间段，查看该区间的汇总和逐条采样明细。
   ========================================================================== */
function labId(row){
  return String(row == null ? '' : (row.ch_id ?? row.page_id ?? row.id ?? ''));
}
function labNum(v){ return dashboardNumber(v); }
function labVal(row){ return labNum(row && (row.value ?? row.views)); }
function labFmt(v){ const n = labNum(v); return n == null ? '—' : n.toLocaleString('en-US'); }
function labPct(v){ const n = labNum(v); return n == null ? '—' : (n > 0 ? '+' : '') + n.toFixed(1) + '%'; }
/* 明细页的百分比通常很小：累计播放量涨几千万，环比也只有零点几个点。 */
function labPctFine(v){
  const n = labNum(v);
  if(n == null) return '—';
  const a = Math.abs(n), digits = a < 0.1 ? 3 : (a < 1 ? 2 : 1);
  return (n > 0 ? '+' : '') + n.toFixed(digits) + '%';
}
function labRateFmt(v){
  const n = labNum(v);
  if(n == null) return '—';
  return n.toLocaleString('en-US', {maximumFractionDigits: Math.abs(n) >= 100 ? 0 : 2});
}
function labClock(ts){
  const n = labNum(ts), d = n == null ? null : new Date(n * 1000);
  if(!d || !Number.isFinite(d.getTime())) return '';
  const p = v => String(v).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate()) +
    ' ' + p(d.getHours()) + ':' + p(d.getMinutes());
}
function labDateStr(ts){
  const n = labNum(ts), d = n == null ? null : new Date(n * 1000);
  if(!d || !Number.isFinite(d.getTime())) return '';
  const p = v => String(v).padStart(2, '0');
  return d.getFullYear() + '-' + p(d.getMonth()+1) + '-' + p(d.getDate());
}
/* 日期 + 整点档 → 该时刻的 Unix 秒（本地时区，取该小时最后一分钟） */
function labDayAt(dateStr, hour){
  const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(String(dateStr || ''));
  if(!m) return null;
  const h = Math.max(0, Math.min(23, Math.round(labNum(hour) ?? 23)));
  return Math.floor(new Date(+m[1], +m[2]-1, +m[3], h, 59, 59).getTime() / 1000);
}
function labDayStart(dateStr){
  const end = labDayAt(dateStr, 0);
  return end == null ? null : end - 3599;
}
function labDayEnd(dateStr){ return labDayAt(dateStr, 23); }
function labSeriesRange(series){
  let min = Infinity, max = -Infinity;
  for(const item of series || []) for(const p of item.points || []){
    const t = labNum(p && p[0]);
    if(t == null) continue;
    if(t < min) min = t;
    if(t > max) max = t;
  }
  return min === Infinity ? {min:null, max:null} : {min, max};
}
/* <= at 的最后一条快照（线性即可：单话题最多几百点） */
function labSnapAt(points, at){
  let out = null;
  for(const p of points || []){
    if(!p || labNum(p[0]) == null) continue;
    if(p[0] > at) break;
    out = p;
  }
  return out;
}
function labSeriesItem(data, id){
  const series = (data && data.series) || [];
  const wanted = String(id == null ? '' : id);
  return series.find(s => labId(s) === wanted) || null;
}
/* 工作台话题搜索：按名称 / ID 过滤，名称按中文本地化排序。 */
function labTopicFilter(series, query){
  const needle = String(query == null ? '' : query).trim().toLowerCase();
  const list = (series || []).slice().sort((a, b) =>
    String(a && a.name || '').localeCompare(String(b && b.name || ''), 'zh-Hans-CN'));
  if(!needle) return list;
  return list.filter(s => {
    const name = String(s && s.name || '').toLowerCase();
    const id = String(labId(s) || '').toLowerCase();
    return name.indexOf(needle) >= 0 || id.indexOf(needle) >= 0;
  });
}
function labTopicMenuHtml(series, topicId, query){
  const list = labTopicFilter(series, query);
  if(!list.length)
    return '<div class="labx-topic-none">没有匹配话题</div>';
  const selected = String(topicId == null ? '' : topicId);
  return list.map(s => {
    const id = labId(s);
    const name = String(s && s.name || id);
    const sub = String(s && (s.cat || s.category) || '');
    const on = id === selected;
    return '<button type="button" class="labx-topic-opt' + (on ? ' on' : '') +
      '" data-lab-topic="' + esc(id) + '" role="option" aria-selected="' +
      (on ? 'true' : 'false') + '">' +
      '<span class="labx-topic-name">' + esc(name) + '</span>' +
      (sub ? '<small>' + esc(sub) + '</small>' : '') +
      '</button>';
  }).join('');
}
function labSecondaryLabel(data){
  if(data && data.secondaryLabel) return String(data.secondaryLabel);
  return data && data.platform === 'xhs' ? '笔记数' : '参与人数';
}
function labHourlyPoints(points){
  const picks = new Map();
  for(const p of points || []){
    const t = labNum(p && p[0]);
    if(t == null) continue;
    const h = Math.floor(t / 3600), late = t - h * 3600;
    const canon = late >= 60 && late <= 480;          // 分钟位 01–08 = 准点那一轮
    const cur = picks.get(h);
    if(!cur || (canon && !cur.canon) || (canon === cur.canon && late < cur.late)){
      picks.set(h, {p, canon, late});
    }
  }
  const out = [];
  [...picks.entries()].sort((a, b) => a[0] - b[0]).forEach(([, pick]) => {
    const last = out[out.length - 1];
    if(last && pick.p[0] - last[0] < 3240){
      if(!pick.canon) return;
      out.pop();
    }
    out.push(pick.p);
  });
  return out;
}

function labGapPoints(points, step){
  const gap = labNum(step);
  if(gap == null || gap < 60) return (points || []).slice();
  const picks = new Map();
  for(const p of points || []){
    const t = labNum(p && p[0]);
    if(t == null) continue;
    const d = new Date(t * 1000);
    const day = new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 1000;
    const key = day + Math.floor((t - day) / gap) * gap;
    const late = t - key;
    const cur = picks.get(key);
    if(!cur || late < cur.late) picks.set(key, {p, late});
  }
  return [...picks.entries()].sort((a, b) => a[0] - b[0]).map(([, pick]) => pick.p);
}
function labGapSeconds(key){
  return { '30m':1800, '15m':900, '5m':300, '3h':10800, '6h':21600, '12h':43200 }[key] || 0;
}
function labGapLabel(key){
  return { auto:'自动', '1h':'1小时', '30m':'30分钟', '15m':'15分钟',
    '5m':'5分钟', '3h':'3小时', '6h':'6小时', '12h':'12小时' }[key] || '自动';
}
function labGapModeLabel(st){
  const key = (st && st.gap) || 'auto';
  if(key === 'auto') return st && st.preset === '24h' ? '1小时' : '原始';
  return labGapLabel(key);
}
function labDetailGap(st){
  const key = (st && st.gap) || 'auto';
  if(key === '1h') return {hourly:true, gap:0};
  if(key === 'auto') return {hourly:!!(st && st.preset === '24h'), gap:0};
  return {hourly:false, gap:labGapSeconds(key)};
}

/* 预设时间窗。min/max 是该话题自己的采样范围，不足时自动收窄。 */
function labRangeForPreset(item, key){
  const r = labSeriesRange([item]);
  if(r.max == null) return {from:null, to:null};
  if(key === 'all') return {from:r.min, to:r.max};
  const days = { '24h':1, '3d':3, '7d':7, '30d':30 }[key] || 7;
  /* 24 小时档按准点链取末端，并让起点落到整点：这样 14:01 → 次日 14:01
     正好是 25 条整点快照，不再被 14:16 手动补采挤成 26 条。 */
  let max = r.max;
  if(key === '24h'){
    const hp = labHourlyPoints(item && item.points);
    if(hp.length) max = labNum(hp[hp.length - 1][0]);
  }
  let from = max - days * 86400;
  if(key === '24h'){
    from = Math.floor(from / 3600) * 3600;
  } else {
    /* 多日预设按自然日展示：最新点是 1 点时，不要让「近 7 天」也从 1 点起。 */
    const day = labDayStart(labDateStr(from));
    if(day != null) from = day;
  }
  return {from: Math.max(r.min, from), to:max};
}
function labPresetLabel(key){
  return { '24h':'近24小时', '3d':'近3天', '7d':'近7天', '30d':'近30天',
    'all':'全部', 'custom':'自定义' }[key] || '近7天';
}
function labDetailData(item, fromTs, toTs, hourly, gapSec){
  const from = labNum(fromTs), to = labNum(toTs);
  const available = labSeriesRange([item]);
  let points = ((item && item.points) || [])
    .filter(p => p && labNum(p[0]) != null && labNum(p[1]) != null)
    .slice().sort((a, b) => a[0] - b[0]);
  if(gapSec) points = labGapPoints(points, gapSec);
  else if(hourly) points = labHourlyPoints(points);
  /* 小红书「讨论量」来自另一条 App 网关轮次，不混进历史快照第三列（笔记数）。 */
  const discussPoints = ((item && item.discussPoints) || [])
    .filter(p => p && labNum(p[0]) != null && labNum(p[1]) != null)
    .slice().sort((a, b) => a[0] - b[0]);
  const discussAt = ts => {
    const p = labSnapAt(discussPoints, ts);
    return p ? labNum(p[1]) : null;
  };
  const out = {id: labId(item), name: item && item.name ? item.name : '',
    from, to, available, rows: [], base: null, start: null, end: null,
    peak: null, low: null, delta: null, pct: null, avgPerHour: null,
    spanHours: null, secondaryDelta: null, secondaryLabel: '',
    discussStart: null, discussEnd: null, discussDelta: null};
  if(from == null || to == null || !points.length) return out;

  let base = null, prev = null;
  const firstIn = {ts:null};
  let end = null;
  for(const p of points){
    const t = labNum(p[0]);
    if(t < from){ base = p; prev = p; continue; }
    if(t > to) break;
    const value = labNum(p[1]);
    if(value == null) continue;
    if(firstIn.ts == null){ firstIn.ts = t; firstIn.value = value; firstIn.secondary = labNum(p[2]); }
    const prevValue = prev ? labNum(prev[1]) : null;
    const delta = prevValue == null ? null : value - prevValue;
    const pct = prevValue == null || prevValue === 0 ? null : delta / Math.abs(prevValue) * 100;
    const gapH = prev ? (t - prev[0]) / 3600 : null;
    const secondary = labNum(p[2]);
    const prevSecondary = prev ? labNum(prev[2]) : null;
    out.rows.push({ts:t, value, prevValue, delta, pct, gapH,
      rate: delta != null && gapH > 0 ? delta / gapH : null,
      secondary, secondaryDelta: secondary != null && prevSecondary != null
        ? secondary - prevSecondary : null,
      discuss: discussAt(t)});
    end = {ts:t, value, secondary};
    if(out.peak == null || value > out.peak.value) out.peak = {ts:t, value};
    if(out.low == null || value < out.low.value) out.low = {ts:t, value};
    prev = p;
  }
  if(!out.rows.length) return out;
  const anchor = base
    ? {ts: labNum(base[0]), value: labNum(base[1]), secondary: labNum(base[2])}
    : firstIn;
  out.base = {ts: anchor.ts, value: labNum(anchor.value),
    secondary: labNum(anchor.secondary)};
  out.start = {ts: anchor.ts, value: labNum(anchor.value)};
  out.end = end;
  out.delta = end.value - anchor.value;
  out.pct = anchor.value === 0 ? null : out.delta / Math.abs(anchor.value) * 100;
  out.spanHours = (end.ts - anchor.ts) / 3600;
  out.avgPerHour = out.spanHours > 0 ? out.delta / out.spanHours : null;
  if(anchor.secondary != null && end.secondary != null)
    out.secondaryDelta = end.secondary - anchor.secondary;
  out.discussStart = discussAt(anchor.ts);
  out.discussEnd = discussAt(end.ts);
  out.discussDelta = out.discussStart != null && out.discussEnd != null
    ? out.discussEnd - out.discussStart : null;
  return out;
}
/* 导出当前话题 / 时间段的采样明细为 CSV；单位、次指标与页面口径一致。 */
function labFileSafe(v){
  return String(v == null ? '' : v).replace(/[\\/:*?"<>|\s]+/g, '_')
    .replace(/_+/g, '_').replace(/^_+|_+$/g, '').slice(0, 80);
}
function labCsvCell(v){
  const s = v == null ? '' : String(v);
  return /[",\n\r]/.test(s) ? '"' + s.replace(/"/g, '""') + '"' : s;
}
function labDetailCsv(data, item, dd){
  const unit = (data && data.unit) || '播放量';
  const sec = labSecondaryLabel(data);
  const hasDiscuss = !!(data && data.platform === 'xhs');
  const lines = [];
  const push = arr => lines.push(arr.map(labCsvCell).join(','));
  push(['平台', data && data.label || '']);
  push(['话题', item && item.name || '']);
  push(['统计口径', unit + ' 累计总量']);
  push(['次指标', sec]);
  if(hasDiscuss){
    push(['讨论量口径', '小红书 App 网关 · 参与人数']);
    push(['区间末讨论量', dd.discussEnd == null ? '暂无轮次' : dd.discussEnd]);
    if(dd.discussDelta != null)
      push(['讨论量区间增长', (dd.discussDelta > 0 ? '+' : '') + dd.discussDelta]);
  }
  push(['时间范围', labClock(dd.from) + ' — ' + labClock(dd.to)]);
  push(['采样条数', dd.rows.length]);
  push(['区间增长', (dd.delta > 0 ? '+' : '') + dd.delta + ' (' + labPctFine(dd.pct) + ')']);
  push(['平均每小时', labRateFmt(dd.avgPerHour)]);
  if(dd.base) push(['首行基准', labClock(dd.base.ts) + ' · ' + labFmt(dd.base.value) + ' ' + unit]);
  push([]);
  const head = ['时间', unit, '较上次', '间隔小时', '每小时', sec];
  if(hasDiscuss) head.push('讨论量');
  push(head);
  for(const r of dd.rows.slice().reverse()){
    const row = [labClock(r.ts), r.value,
      r.delta == null ? '' : r.delta,
      r.gapH == null ? '' : r.gapH.toFixed(2),

function labDownloadCsv(filename, text){
  /* Android WebView 对 blob + <a download> 不会落盘，交给原生「保存到文件」；
     桌面浏览器没有 Native.exportCsv，继续走 Blob 下载。 */
  if(typeof window !== 'undefined' && window.Native &&
    typeof window.Native.exportCsv === 'function'){
    try{ window.Native.exportCsv(filename, text); return true; }catch(e){ return false; }
  }
  if(typeof document === 'undefined' || typeof Blob === 'undefined' ||
    typeof URL === 'undefined' || !URL.createObjectURL) return false;
  try{
    const blob = new Blob(['\ufeff' + text], {type:'text/csv;charset=utf-8'});
    const href = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = href; a.download = filename; a.style.display = 'none';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(href), 1000);
    return true;
  }catch(e){ return false; }
}
/* 轻量 SVG 折线；只画选中时间段，坐标轴交给表头和区间标签承担。 */
function labChartSvg(points, fromTs, toTs){
  const from = labNum(fromTs), to = labNum(toTs);
  if(from == null || to == null) return '<div class="labx-chart-empty">没有可绘制的区间</div>';
  const pts = (points || []).filter(p => p && labNum(p[0]) != null &&
    labNum(p[1]) != null && p[0] >= from && p[0] <= to)
    .slice().sort((a, b) => a[0] - b[0]);
  if(!pts.length) return '<div class="labx-chart-empty">该时间段没有采样</div>';
  let min = Infinity, max = -Infinity;
  for(const p of pts){ const v = labNum(p[1]); if(v < min) min = v; if(v > max) max = v; }
  if(min === max){ min -= 1; max += 1; }
  const W = 1000, H = 170, padX = 12, padY = 18;
  const span = to - from || 1;
  const x = ts => padX + (ts - from) / span * (W - padX * 2);
  const y = v => H - padY - (v - min) / (max - min) * (H - padY * 2);
  const d = pts.map((p, i) => (i ? 'L' : 'M') + x(p[0]).toFixed(1) + ' ' +
    y(labNum(p[1])).toFixed(1)).join(' ');
  const area = d + ' L' + x(pts[pts.length - 1][0]).toFixed(1) + ' ' + (H - padY) +
    ' L' + x(pts[0][0]).toFixed(1) + ' ' + (H - padY) + ' Z';
  const last = pts[pts.length - 1];
  return '<svg class="labx-chart-svg" viewBox="0 0 ' + W + ' ' + H +
    '" preserveAspectRatio="none" role="img" aria-label="所选时间段数值走势">' +
    '<path d="' + area + '" fill="rgba(47,111,235,.10)" stroke="none"></path>' +
    '<path d="' + d + '" fill="none" stroke="#2f6feb" stroke-width="2.2" ' +
    'stroke-linecap="round" stroke-linejoin="round"></path>' +
    '<circle cx="' + x(last[0]).toFixed(1) + '" cy="' + y(labNum(last[1])).toFixed(1) +
    '" r="3.6" fill="#2f6feb"></circle></svg>';
}
/* 横轴刻度：首尾都带，解决最左侧刻度被容器裁掉的问题。 */
function labAxisTicks(fromTs, toTs, count){
  const from = labNum(fromTs), to = labNum(toTs);
  if(from == null || to == null || !(to > from)) return [];
  const n = Math.max(2, Math.min(6, count || 4));
  return Array.from({length:n}, (_, i) => from + (to - from) * i / (n - 1));
}
function labAxisText(ts, spanSec){
  const n = labNum(ts), d = n == null ? null : new Date(n * 1000);
  if(!d || !Number.isFinite(d.getTime())) return '';
  const p = v => String(v).padStart(2, '0');
  const md = p(d.getMonth() + 1) + '-' + p(d.getDate());
  if(spanSec <= 36 * 3600) return p(d.getHours()) + ':00';
  if(spanSec <= 7 * 86400) return md + ' ' + p(d.getHours()) + ':00';
  return md;
}
function labChartAxisHtml(fromTs, toTs){
  const from = labNum(fromTs), to = labNum(toTs);
  if(from == null || to == null || !(to > from)) return '';
  const span = to - from;
  const ticks = labAxisTicks(from, to, 4);
  return '<div class="labx-chart-axis" aria-hidden="true">' + ticks.map((t, i) =>
    '<span class="' + (i === 0 ? 'labx-axis-start' : (i === ticks.length - 1 ? 'labx-axis-end' : '')) +
    '">' + esc(labAxisText(t, span)) + '</span>').join('') + '</div>';
}
/* 多话题对比：各自以区间前最后一条为 100，画区间涨幅曲线。 */
const LAB_COMPARE_COLORS = ['#2f6feb', '#d95f59', '#2a9d8f', '#c58b22', '#7b61c9'];
function labCompareSeries(series, currentId, extraIds, fromTs, toTs){
  const from = labNum(fromTs), to = labNum(toTs);
  if(from == null || to == null || !(to > from)) return [];
  const ids = [String(currentId == null ? '' : currentId)]
    .concat((extraIds || []).map(String));
  const out = [], seen = {};
  for(const id of ids){
    if(!id || seen[id]) continue;
    seen[id] = true;
    const item = (series || []).find(s => labId(s) === id);
    if(!item) continue;
    const dd = labDetailData(item, from, to);
    if(!dd.rows.length || !dd.start) continue;
    const base = labNum(dd.start.value);
    if(base == null || base === 0) continue;
    const points = [[from, 0]];
    for(const p of item.points || []){
      const t = labNum(p && p[0]), v = labNum(p && p[1]);
      if(t == null || v == null || t < from || t > to) continue;
      points.push([t, (v - base) / Math.abs(base) * 100]);
    }
    const sorted = points.slice().sort((a, b) => a[0] - b[0]);
    const dedup = [];
    for(const p of sorted){
      if(dedup.length && dedup[dedup.length - 1][0] === p[0])
        dedup[dedup.length - 1] = p;
      else dedup.push(p);
    }
    if(dedup.length < 2) continue;
    out.push({id, name: String(item.name || id), color: LAB_COMPARE_COLORS[out.length % LAB_COMPARE_COLORS.length],
      base, end: dd.end.value, pct: dd.pct, points: dedup});
  }
  return out;
}

  const compareExtras = () => (st.compareIds || []).map(String)
    .filter(id => id && id !== labId(current()));
  const refreshCompareMenu = () => {
    const box = compareOptionsNode();
    if(box) box.innerHTML = labCompareMenuHtml(series, labId(current()), compareExtras(), st.compareQuery);
  };
  const setCompareOpen = open => {
    st.compareOpen = !!open;
    const menu = compareMenuNode();
    if(menu){
      if(open) menu.removeAttribute('hidden');
      else menu.setAttribute('hidden', 'hidden');
    }
  };
  const openMenu = () => {
    refreshMenu();
    setMenuOpen(true);
    const input = inputNode();
    if(input && input.focus) input.focus();
  };
  const chooseTopic = id => {
    if(id == null || id === '') return;
    st.topicId = String(id);
    st.topicSearch = '';
    st.compareIds = (st.compareIds || []).filter(x => String(x) !== st.topicId);
    st.compareOpen = false;
    st.compareQuery = '';
    st.preset = '7d';
    syncRange(true);
    render();
  };
  root.onmousedown = e => {
    const t = e.target && e.target.closest
      ? e.target.closest('[data-lab-topic],[data-lab-compare-add]') : null;
    /* 选项按下时不要把焦点交给按钮，否则 input 先 blur、菜单会先收起来。 */
    if(t && e.preventDefault) e.preventDefault();
  };
  root.onclick = e => {
    const target = e.target;
    /* 不能把 target.closest 拆成裸函数调用：会丢掉 this，Chrome 报 Illegal invocation。 */
    const closest = sel => target && target.closest ? target.closest(sel) : null;
    if(!target){ setMenuOpen(false); return; }
    const compareOpenBtn = closest('[data-lab-compare-open]');
    if(compareOpenBtn){
      st.compareOpen = true;
      st.compareQuery = '';
      render();
      const input = qs('#labCompareSearch');
      if(input && input.focus) input.focus();
      return;
    }
    const compareAddBtn = closest('[data-lab-compare-add]');
    if(compareAddBtn){
      const id = String(compareAddBtn.dataset.labCompareAdd || '');
      if(id && id !== labId(current()) && !st.compareIds.map(String).includes(id) &&
        st.compareIds.length < 4){
        st.compareIds.push(id);
        st.compareOpen = false;
        st.compareQuery = '';
        render();
      }
      return;
    }
    const compareRemoveBtn = closest('[data-lab-compare-remove]');
    if(compareRemoveBtn){
      const id = String(compareRemoveBtn.dataset.labCompareRemove || '');
      st.compareIds = (st.compareIds || []).filter(x => String(x) !== id);
      render();
      return;
    }
    const exportBtn = closest('[data-lab-export]');
    if(exportBtn){
      const item = current();
      if(!item) return;
      const gapSpec = labDetailGap(st);
      const dd = labDetailData(item, st.fromTs, st.toTs, gapSpec.hourly, gapSpec.gap);
      if(!dd.rows.length) return;
      const ok = labDownloadCsv(labExportFileName(data, item, st), labDetailCsv(data, item, dd));
      if(!ok) exportBtn.textContent = '导出失败';
      return;
    }
    const presetBtn = closest('[data-lab-preset]');
    if(presetBtn){
      st.preset = presetBtn.dataset.labPreset;
      syncRange(st.preset !== 'custom');
      render();
      return;
    }
    const topicBtn = closest('[data-lab-topic]');
    if(topicBtn){
      chooseTopic(topicBtn.dataset.labTopic);
      return;
    }
    /* 再点一次输入框，菜单已经收起时重新展开全部索引。 */
    if(closest('#labTopicSearch')){
      setCompareOpen(false);
      openMenu();
      return;
    }
    if(st.compareOpen && !closest('[data-lab-compare-box]')) setCompareOpen(false);
    setMenuOpen(false);
  };
  let composingSearch = false;
  root.oninput = e => {
    const el = e.target;
    if(!el) return;
    if(el.id === 'labCompareSearch'){
      st.compareQuery = String(el.value == null ? '' : el.value);
      st.compareOpen = true;
      refreshCompareMenu();
      const menu = compareMenuNode();
      if(menu) menu.removeAttribute('hidden');
      return;
    }
    if(el.id !== 'labTopicSearch') return;
    st.topicSearch = String(el.value == null ? '' : el.value);
    /* 组词期间也刷新索引：部分 Android WebView 不补发 compositionend，
       如果这里直接 return，搜索会一直停在完整列表；只更新菜单、不动当前话题和输入框，
       不会打断输入法。 */
    refreshMenu();
    setMenuOpen(true);
  };
  root.oncompositionstart = e => {
    if(e.target && e.target.id === 'labTopicSearch') composingSearch = true;
  };
  root.oncompositionend = e => {
    if(!e.target || e.target.id !== 'labTopicSearch') return;
    composingSearch = false;
    st.topicSearch = String(e.target.value == null ? '' : e.target.value);
    refreshMenu();
    setMenuOpen(true);
  };
  root.onfocusin = e => {
    if(!e.target) return;
    if(e.target.id === 'labTopicSearch'){ openMenu(); return; }
    if(e.target.id === 'labCompareSearch'){
      st.compareOpen = true;
      refreshCompareMenu();
      const menu = compareMenuNode();
      if(menu) menu.removeAttribute('hidden');
    }
  };
  root.onfocusout = e => {
    if(!e.target || e.target.id !== 'labTopicSearch') return;
    setTimeout(() => {
      const active = typeof document !== 'undefined' ? document.activeElement : null;
      if(active && root.contains && root.contains(active)) return;
      setMenuOpen(false);
    }, 120);
  };
  root.onkeydown = e => {
    if(!e.target) return;
    if(e.target.id === 'labCompareSearch'){
      if(e.key === 'Escape'){
        if(e.preventDefault) e.preventDefault();
        setCompareOpen(false);
      }
      return;
    }
    if(e.target.id !== 'labTopicSearch') return;
    const matches = labTopicFilter(series, st.topicSearch);
    if(e.key === 'Enter'){
      if(matches.length){
        if(e.preventDefault) e.preventDefault();
        chooseTopic(labId(matches[0]));
      }
      return;
    }
    if(e.key === 'Escape'){
      if(e.preventDefault) e.preventDefault();
      setMenuOpen(false);
      setCompareOpen(false);
    }
  };
  root.onchange = e => {
    const el = e.target;
    if(!el || !el.id) return;
    if(el.id === 'labFrom' || el.id === 'labTo'){
      if(el.id === 'labFrom') st.fromDate = el.value; else st.toDate = el.value;
      st.preset = 'custom';
      syncRange(false);
      render();
      return;
    }
    if(el.id === 'labGap'){
      st.gap = el.value || 'auto';
      render();
    }
  };
  render();
}
/* 桌面直接页顶栏的平台切换：直接打开时走 href；在 shell 的 iframe 里时
   通知外壳切换 tab，不重新加载整个 iframe。 */
function labBindPlatformSwitch(doc){
  const d = doc || (typeof document !== 'undefined' ? document : null);
  if(!d) return false;
  const nav = d.querySelector('.plat-switch');
  if(!nav || nav.getAttribute('data-lab-bound') === '1') return false;
  /* 壳页面已经有平台 Tab；iframe 内再放一套只重复占位，隐藏掉。 */
  if(typeof window !== 'undefined' && window.top !== window.self)
    nav.classList.add('in-frame');
  nav.setAttribute('data-lab-bound', '1');
  nav.addEventListener('click', e => {
    const a = e.target && e.target.closest ? e.target.closest('a[data-platform]') : null;
    if(!a) return;
    const platform = a.getAttribute('data-platform');
    if(typeof window !== 'undefined' && window.top !== window.self){
      try{
        window.top.postMessage({type:'dtp-platform', platform:platform},
          window.location.origin);
        e.preventDefault();
      }catch(err){}
    }
  });
  return true;
}
if(typeof document !== 'undefined'){
  if(document.readyState === 'loading')
    document.addEventListener('DOMContentLoaded', () => labBindPlatformSwitch(document),
      {once:true});
  else labBindPlatformSwitch(document);
}

/* ============================================================================
   跨平台新增话题（2026-11-13）
   ----------------------------------------------------------------------------
   入口不再挂在抖音表 / 小红书表里：壳顶栏的「新增话题」把消息发给当前 iframe，
   页面收到后打开这个弹层。一次搜索同时查两个平台，选中候选后一次提交；
   后端 /api/topics/both 只写缺失的一边，后写失败会把先写的一边回滚。
   App 有自己的 GitHub 双写表单，这里只服务桌面两页和壳。

var DTPTopicAdd = (function(){
  if(typeof document === 'undefined' || typeof window === 'undefined') return null;
  var state = { picked:{dy:'', xhs:''}, names:{dy:'', xhs:''}, rows:[] };
  var mine = { loaded:false, loading:false, err:'', rows:[] };   // 「已监控话题」列表
  var dirty = false;                                             // 本轮删过话题，关弹层后要刷新页面
  var ui = null;

  function $(id){ return document.getElementById(String(id).replace(/^#/, '')); }
  function notify(msg, bad){
    if(typeof window.toast === 'function'){
      try{ window.toast(msg, bad ? 'bad' : ''); return; }catch(e){}
    }
    var t = $('dtpAddToast');
    if(!t){
      t = document.createElement('div'); t.id = 'dtpAddToast';
      t.style.cssText = 'position:fixed;top:64px;left:50%;transform:translateX(-50%);z-index:110;' +
        'background:#17243a;color:#fff;padding:8px 14px;border-radius:8px;font-size:13px;' +

    t.textContent = msg;

    clearTimeout(t._tm);
    t._tm = setTimeout(function(){ t.remove(); }, bad ? 6000 : 3200);
  }
  async function request(url, opt){
    var r = await fetch(url, opt);
    var j = null;
    try{ j = await r.json(); }catch(e){ throw new Error('服务端返回异常（' + r.status + '）'); }
    if(!r.ok || (j && j.ok === false)) throw new Error((j && j.error) || ('HTTP ' + r.status));
    return j;
  }
  function fmtCompact(v){
    v = Number(v) || 0;
    if(v >= 100000000) return (v / 100000000).toFixed(2).replace(/\.?0+$/, '') + ' 亿';
    if(v >= 10000) return (v / 10000).toFixed(1).replace(/\.0$/, '') + ' 万';
    return v.toLocaleString();
  }
  function defaultCategory(){
    /* 默认分类：上次真提交过的（弹层自己记 dtp.cat）→ 列表当前筛选 → 未分类。
       不再读旧弹窗输入框（#addcat/#addCat）：dy 页那边被 fillCatList 预填过
       「女明星」，残留值会把默认分类永远钉在那（2026-11-15）。 */
    var last = '';
    try{ last = localStorage.getItem('dtp.cat') || ''; }catch(e){}
    if (last) return last;
    var active = document.querySelector('#catbar button.on[data-cat]');
    if (active && active.dataset.cat) return active.dataset.cat;
    return '未分类';
  }
  function ensure(){
    if(ui && ui.mask) return ui;
    var mask = document.createElement('div');

    mask.innerHTML =
      '<div class="topic-add-modal" role="dialog" aria-modal="true" aria-labelledby="dtpAddTtl">' +
        '<div class="topic-add-head">' +
          '<div><div class="topic-add-kicker">DOUYIN + XIAOHONGSHU</div>' +
          '<h2 id="dtpAddTtl">新增话题</h2></div>' +

          '<div class="topic-add-search">' +
            '<input id="dtpAddName" placeholder="输入话题名，如：杨超越" autocomplete="off">' +
            '<button class="btn primary" id="dtpAddSearch" type="button">搜两个平台</button>' +
          '</div>' +
          '<div class="topic-add-status" id="dtpAddStatus">输入名称后搜索，选中两个平台的候选；也可以直接贴链接。</div>' +
          '<div class="topic-add-results" id="dtpAddResults"></div>' +

            '</div>' +

          // 删除话题（2026-11-15）：跟「新增」放在同一个弹层里，列表来自两台服务的
          // /api/state（抖音）和 /xhsapi/api/state（小红书），逐个移除；删完不清空

          '<details class="topic-add-advanced" id="dtpAddManage">' +

          '<button class="btn primary" id="dtpAddGo" type="button" disabled>添加到两个平台</button>' +
        '</div>' +
      '</div>';
    document.body.appendChild(mask);
    var close = function(){ closeDialog(); };
    $('#dtpAddClose').addEventListener('click', close);
    $('#dtpAddCancel').addEventListener('click', close);
    /* 遮罩点击只在「什么都没填」时直接关：名称/分类/链接填了一半、或已选了候选，
       误碰遮罩就全丢（2026-11-15 UI 审查）。ESC 始终可关，与页面其它弹窗一致——
       之前它是全站唯一 ESC 关不掉的弹窗。 */
    mask.addEventListener('click', function(e){
      if(e.target !== mask) return;
      var dirty = ($('#dtpAddName').value || '').trim() || ($('#dtpAddCat').value || '').trim()
        || ($('#dtpAddDy').value || '').trim() || ($('#dtpAddXhs').value || '').trim()
        || state.picked.dy || state.picked.xhs;
      if(dirty){ notify('内容还没提交：点右上 × 或「取消」关闭', true); return; }
      close();

    document.addEventListener('keydown', function(e){
      if(e.key === 'Escape' && ui && ui.mask.classList.contains('on')) close();

    $('#dtpAddName').addEventListener('keydown', function(e){

    });
    $('#dtpAddDy').addEventListener('input', function(){ state.picked.dy = ''; state.names.dy = ''; renderRows(); sync(); });
    $('#dtpAddXhs').addEventListener('input', function(){ state.picked.xhs = ''; state.names.xhs = ''; renderRows(); sync(); });
    $('#dtpAddGo').addEventListener('click', function(){ commit(false); });
    $('#dtpAddOne').addEventListener('click', function(){ commit(true); });

  }
  function openDialog(opts){
    ensure();
    opts = opts || {};
    state = { picked:{dy:'', xhs:''}, names:{dy:'', xhs:''}, rows:[] };
    mine = { loaded:false, loading:false, err:'', rows:[] };

       里提示；不选就按默认提交（见 commit）。 */
    var catDefault = opts.category || defaultCategory();

  function closeDialog(){

  function renderRows(){
    var box = $('#dtpAddResults');

  /* ---------------------------- 已监控话题：删除 ----------------------------
     桌面两页都能用：抖音页拉 /api/state、小红书页拉 /xhsapi/api/state，
     两边都在同一个后端进程里，所以两个请求一次拿全。
     删除走各自已有的 DELETE 接口（/api/topics、/xhsapi/api/topics）——
     历史快照不删，误删加回来趋势还在。 */
  async function loadMine(){
    if(mine.loading) return;
    mine.loading = true;
    renderMine();
    var errs = [], out = [];
    var dy = null, xhs = null;
    try{ dy = await request('/api/state?spark=0'); }
    catch(e){ errs.push('抖音：' + e.message); }
    try{ xhs = await request('/xhsapi/api/state?spark=0'); }
    catch(e){ errs.push('小红书：' + e.message); }
    ((dy && dy.topics) || []).forEach(function(t){
      if(!t || !t.ch_id) return;
      out.push({pf:'dy', id:String(t.ch_id), name:t.name || String(t.ch_id),
                cat:(t.cats && t.cats[0]) || t.cat || '未分类'});
    });
    ((xhs && xhs.topics) || []).forEach(function(t){
      if(!t || !t.page_id) return;
      out.push({pf:'xhs', id:String(t.page_id), name:t.name || String(t.page_id),
                cat:(t.cats && t.cats[0]) || t.cat || '未分类'});
    });
    out.sort(function(a, b){ return String(a.name).localeCompare(String(b.name), 'zh-CN'); });
    mine.rows = out;
    mine.err = errs.join('；');
    mine.loaded = true;
    mine.loading = false;
    renderMine();
  }
  function renderMine(){
    var box = $('#dtpAddMine');
    if(!box) return;
    if(mine.loading){
      box.innerHTML = '<div class="topic-add-empty">正在读取监控列表…</div>';
      return;
    }
    var q = (($('#dtpAddMineQ') && $('#dtpAddMineQ').value) || '').trim().toLowerCase();
    var rows = mine.rows.filter(function(r){
      return !q || (r.name + ' ' + r.id).toLowerCase().indexOf(q) >= 0;
    });
    var head = '<div class="topic-add-mine-h"><span>共 ' + mine.rows.length + ' 个话题</span>' +
      (mine.err ? '<span class="bad">' + esc(mine.err) + '</span>' : '') + '</div>';
    if(!mine.rows.length){
      box.innerHTML = head + '<div class="topic-add-empty">监控列表是空的。</div>';
      return;
    }
    if(!rows.length){
      box.innerHTML = head + '<div class="topic-add-empty">没有匹配的话题。</div>';
      return;
    }
    box.innerHTML = head + rows.map(function(r){
      return '<div class="topic-add-mine-row">' +
        '<span class="topic-add-pf ' + r.pf + '">' + (r.pf === 'dy' ? '抖音' : '小红书') + '</span>' +
        '<span class="topic-add-nm">' + esc(r.name) + '</span>' +
        '<span class="topic-add-cat">' + esc(r.cat || '') + '</span>' +
        '<button type="button" class="topic-add-rm" data-rm-pf="' + r.pf +
          '" data-rm-id="' + esc(r.id) + '" data-rm-name="' + esc(r.name) + '">移除</button>' +
      '</div>';
    }).join('');
    box.querySelectorAll('.topic-add-rm').forEach(function(btn){
      btn.addEventListener('click', function(){
        removeMine(btn.getAttribute('data-rm-pf'),
                   btn.getAttribute('data-rm-id'),
                   btn.getAttribute('data-rm-name'));
      });
    });
  }
  async function removeMine(pf, id, name){
    name = String(name || id || '');
    /* 2026-11-15 用户定：两边名单同步，删就一起删（服务端按同名清理另一平台） */
    if(!confirm('从监控列表移除「' + name + '」？\n\n抖音和小红书两边同名话题会一起移除；历史数据保留，重新添加即可恢复曲线。')) return;
    $('#dtpAddStatus').textContent = '正在移除，并同步到 GitHub…';
    try{
      var d = pf === 'dy'
        ? await request('/api/topics?ch_id=' + encodeURIComponent(id), {method:'DELETE'})
        : await request('/xhsapi/api/topics?page_id=' + encodeURIComponent(id), {method:'DELETE'});
      var sync = (d && d.sync) || null;
      var syncTxt = !sync ? ''
        : (sync.ok ? '；云端已同步（' + sync.msg + '）' : '；⚠️ 云端同步失败：' + sync.msg);
      notify((d && d.msg) || ('已移除「' + name + '」'), !!(sync && !sync.ok));
      mine.rows = mine.rows.filter(function(r){
        return !(r.pf === pf && String(r.id) === String(id));
      });
      /* 另一边的同名行已被服务端一起删掉，本地立刻跟着隐掉，别等重拉 */
      mine.rows = mine.rows.filter(function(r){
        return r.pf === pf || String(r.name) !== name;
      });
      (state.rows || []).forEach(function(r){
        if(r.platform === pf && String(r.id) === String(id)){
          r.added = false;
          if(state.picked[pf] === String(r.id)){ state.picked[pf] = ''; state.names[pf] = ''; }
        }
      });
      dirty = true;
      renderMine(); renderRows(); sync();
      $('#dtpAddStatus').textContent = '已移除「' + name + '」' + syncTxt + '；关闭弹层后列表自动刷新。';
    }catch(e){
      notify('移除失败：' + e.message, true);
    }
  }
  function autoPick(rows, q){
    [['dy','抖音'], ['xhs','小红书']].forEach(function(g){
      var pf = g[0];
      if(state.picked[pf]) return;
      var exact = rows.filter(function(r){
        return r.platform === pf && String(r.name || '').replace(/^#+/, '').replace(/\s+/g, '').toLowerCase()
          === String(q || '').replace(/^#+/, '').replace(/\s+/g, '').toLowerCase();
      });
      if(exact.length === 1){
        state.picked[pf] = String(exact[0].id);
        state.names[pf] = String(exact[0].name || '');
      }
    });
    renderRows(); sync();
  }
  async function doSearch(){
    var q = ($('#dtpAddName').value || '').trim();
    if(!q){ $('#dtpAddErr').textContent = '先输入要搜的话题名'; $('#dtpAddName').focus(); return; }
    var btn = $('#dtpAddSearch');
    btn.disabled = true; btn.textContent = '搜索中…';
    $('#dtpAddErr').textContent = '';
    $('#dtpAddStatus').textContent = '正在同时搜索抖音和小红书…';
    try{
      var d = await request('/api/topics/lookup?q=' + encodeURIComponent(q));
      state.rows = d.rows || [];
      autoPick(state.rows, q);
      var missing = ['dy','xhs'].filter(function(pf){ return !state.picked[pf]; });
      var errs = d.errors || {};
      var err = [];
      if(errs.dy) err.push('抖音：' + errs.dy);
      if(errs.xhs) err.push('小红书：' + errs.xhs);
      var msg = state.rows.length
        ? (missing.length ? '已找到候选；' + missing.map(function(pf){ return pf === 'dy' ? '抖音' : '小红书'; }).join('、') + '还没选中。' : '两个平台都已选中，可以直接添加。')
        : '没有搜到候选。可以展开下面直接贴链接。';
      if(err.length) msg += ' ' + err.join('；');
      $('#dtpAddStatus').textContent = msg;
      $('#dtpAddErr').textContent = err.length ? err.join('；') : '';
    }catch(e){
      $('#dtpAddStatus').textContent = '搜索失败，可以在下面直接贴链接/ID。';
      $('#dtpAddErr').textContent = e.message;
    }finally{
      btn.disabled = false; btn.textContent = '搜两个平台';
    }
  }
  function sync(){
    var dy = state.picked.dy || ($('#dtpAddDy') && $('#dtpAddDy').value.trim());
    var xhs = state.picked.xhs || ($('#dtpAddXhs') && $('#dtpAddXhs').value.trim());
    var both = !!(dy && xhs), one = !!(dy || xhs) && !(dy && xhs);
    $('#dtpAddGo').disabled = !both;
    $('#dtpAddOne').hidden = !one;
    $('#dtpAddOne').textContent = dy ? '只添加抖音' : '只添加小红书';
    if(both) $('#dtpAddGo').textContent = '添加到两个平台';
  }
  async function commit(oneOnly){
    var dy = state.picked.dy || ($('#dtpAddDy').value || '').trim();
    var xhs = state.picked.xhs || ($('#dtpAddXhs').value || '').trim();
    if(oneOnly){ if(dy && !xhs) xhs = ''; else if(xhs && !dy) dy = ''; }
    if(!dy && !xhs){ $('#dtpAddErr').textContent = '请先选中至少一个平台的话题'; return; }
    var nm = ($('#dtpAddName').value || '').trim();
    var dyName = state.names.dy, xhsName = state.names.xhs;
    if(dy && xhs && dyName && xhsName && dyName !== xhsName){
      $('#dtpAddErr').textContent = '两个平台选中的名称不一致，请重新选择';
      return;
    }
    if(dy && xhs && !nm) nm = dyName || xhsName;
    if(dy && xhs && !nm){ $('#dtpAddErr').textContent = '两个平台一起添加时请填写话题名称'; return; }
    var cat = ($('#dtpAddCat').value || '').trim() || defaultCategory();
    var btn = $('#dtpAddGo');
    btn.disabled = true; btn.textContent = '提交中…';
    $('#dtpAddErr').textContent = '';
    try{
      var d = await request('/api/topics/both', {
        method:'POST', headers:{'Content-Type':'application/json'},
        body: JSON.stringify({name:nm, dy_name:dyName, xhs_name:xhsName,
          category:cat, categories:[cat], dy:dy, xhs:xhs})
      });
      notify(d.msg || '已提交', !!(d.sync && !d.sync.ok));
      try{ localStorage.setItem('dtp.cat', cat); }catch(e){}
      closeDialog();
      if(window.top !== window.self){
        try{ window.top.postMessage({type:'dtp-topic-added', msg:d.msg || ''}, location.origin); }catch(e){}
      }else{
        setTimeout(function(){ location.reload(); }, 450);
      }
    }catch(e){
      $('#dtpAddErr').textContent = e.message;
      btn.disabled = false; btn.textContent = '添加到两个平台';
    }
  }

  if(typeof window !== 'undefined' && window.top !== window.self){
    window.addEventListener('message', function(e){
      if(e.origin !== location.origin) return;
      var d = e.data || {};
      if(d.type === 'dtp-add-topic') openDialog({category:d.category});
    });
    var hidePageAdd = function(){
      var pageAddBtn = document.getElementById('btnAdd');
      if(pageAddBtn) pageAddBtn.style.display = 'none';
    };
    if(document.readyState === 'loading')
      document.addEventListener('DOMContentLoaded', hidePageAdd, {once:true});
    else hidePageAdd();
  }
  return {open:openDialog};
})();

.labx-kpi>i{display:block; margin-top:3px; color:var(--mute); font-style:normal; font-size:var(--fs-1); overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.labx-chart{padding:12px 16px 0}
.labx-chart-head,.labx-table-head{display:flex; align-items:baseline; justify-content:space-between; gap:10px; min-width:0}
.labx-chart-head>span,.labx-table-head>span{font-weight:650; color:var(--ink); font-size:var(--fs-3)}
.labx-chart-head>em,.labx-table-tools>em{font-style:normal; color:var(--mute); font-size:var(--fs-1); text-align:right; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.labx-table-tools{display:flex; align-items:center; justify-content:flex-end; gap:10px; min-width:0; flex-wrap:wrap}
.labx-export{height:28px; padding:0 10px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel2); color:var(--ink2); font:inherit; font-size:var(--fs-1); cursor:pointer; white-space:nowrap}
.labx-export:hover{border-color:var(--accent); color:var(--accent)}
.labx-chart-svg{display:block; width:100%; height:140px; margin:6px 0 0}
.labx-chart-foot{display:flex; justify-content:space-between; gap:12px; color:var(--faint); font-size:var(--fs-1);margin-top:2px}
.labx-chart-axis{display:flex; justify-content:space-between; gap:4px; margin-top:3px; color:var(--faint); font-size:var(--fs-1); font-variant-numeric:tabular-nums; line-height:1.25}
.labx-chart-axis>span{min-width:0; white-space:nowrap; text-align:center}
.labx-chart-axis>.labx-axis-start{text-align:left}
.labx-chart-axis>.labx-axis-end{text-align:right}
.labx-compare{padding:12px 16px 0; border-top:1px solid var(--line); margin-top:12px}
.labx-compare-picker{display:flex; align-items:center; flex-wrap:wrap; gap:6px; margin:8px 0 2px}
.labx-compare-chip{display:inline-flex; align-items:center; gap:5px; min-width:0; max-width:100%; padding:5px 8px; border:1px solid var(--line); border-radius:999px; background:var(--panel2); color:var(--ink2); font-size:var(--fs-1)}
.labx-compare-chip.on{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.labx-compare-chip>i{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.labx-compare-chip>span{min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap}
.labx-compare-chip>small{flex:0 0 auto; color:var(--mute); font-size:var(--fs-1)}
.labx-compare-chip>button{border:0; background:transparent; color:var(--mute); font:inherit; font-size:var(--fs-3); line-height:1; cursor:pointer; padding:0 0 0 1px}
.labx-compare-chip>button:hover{color:var(--down)}
.labx-compare-pick{position:relative; display:inline-block; min-width:0}
.labx-compare-add{height:30px; padding:0 10px; border:1px dashed var(--line); border-radius:999px; background:transparent; color:var(--accent); font:inherit; font-size:var(--fs-1); cursor:pointer; white-space:nowrap}
.labx-compare-add:hover,.labx-compare-add:focus-visible{border-color:var(--accent); background:var(--accent-soft)}
.labx-compare-menu{position:absolute; left:0; top:calc(100% + 5px); z-index:25; width:270px; max-height:270px; overflow:auto; padding:6px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel); box-shadow:var(--sh-2)}
.labx-compare-menu[hidden]{display:none}
.labx-compare-search{display:block; width:100%; height:32px; margin-bottom:5px; padding:0 8px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel2); color:var(--ink); font:inherit; font-size:var(--fs-2); outline:none; box-sizing:border-box}
.labx-compare-search:focus{border-color:var(--accent); box-shadow:0 0 0 2px var(--accent-soft)}
.labx-compare-opt{display:flex; align-items:center; justify-content:space-between; gap:8px; width:100%; min-height:32px; padding:5px 8px; border:0; border-radius:6px; background:transparent; color:var(--ink2); font:inherit; font-size:var(--fs-2); text-align:left; cursor:pointer}
.labx-compare-opt:hover,.labx-compare-opt:focus-visible{background:var(--panel2); color:var(--ink)}
.labx-compare-opt small{flex:0 0 auto; color:var(--mute); font-size:var(--fs-1)}
.labx-compare-legend{display:flex; align-items:center; flex-wrap:wrap; gap:7px 14px; padding:7px 0 2px; color:var(--ink2); font-size:var(--fs-1)}
.labx-compare-legend>span{display:inline-flex; align-items:center; gap:5px; min-width:0}
.labx-compare-legend i{width:7px; height:7px; border-radius:50%; flex:0 0 auto}
.labx-compare-legend b{font-variant-numeric:tabular-nums}
.labx-compare-legend small{color:var(--mute); font-variant-numeric:tabular-nums}
.labx-compare-empty{margin:4px 0 8px}
.labx-chart-empty{padding:28px 8px; color:var(--mute); text-align:center; font-size:var(--fs-2)}
.labx-table-head{padding:12px 16px 8px; border-top:1px solid var(--line)}
.labx-table-wrap{max-height:34vh; overflow:auto; border-bottom:1px solid var(--line)}
.labx-table{width:100%; border-collapse:collapse; font-size:var(--fs-2); font-variant-numeric:tabular-nums}
/* 2026-11-23 用户反馈：列名和数据不对齐。表头改成和数据同向：
   时间列左对齐，数值列右对齐，读的时候一眼对得上。 */
.labx-table th,.labx-table td{padding:7px 6px; border-bottom:1px solid var(--line2); white-space:nowrap; text-align:left}
.labx-table thead th{text-align:left}
.labx-table th{position:sticky; top:0; z-index:1; background:var(--panel2); color:var(--ink2); font-weight:650; font-size:var(--fs-2)}
.labx-table td{color:var(--ink2)}
.labx-table tbody tr:hover td{background:var(--panel2)}
.labx-table td.num{text-align:right; font-variant-numeric:tabular-nums}
.labx-table th.num{text-align:right}
.labx-gap{display:inline-flex; align-items:center; gap:5px; color:var(--mute); font-size:var(--fs-1); flex:0 0 auto}
.labx-gap select{height:28px; padding:0 4px; border:1px solid var(--line); border-radius:var(--r-sm); background:var(--panel2); color:var(--ink2); font:inherit; font-size:var(--fs-1); outline:none}
.labx-gap select:focus{border-color:var(--accent)}

.labx-table .up{color:var(--up)}
.labx-table .down{color:var(--down)}
.labx-table .labx-muted{color:var(--mute)}
.labx-table .labx-time{color:var(--ink)}
.labx-empty{padding:40px 20px; text-align:center; color:var(--mute); font-size:var(--fs-3)}
.labx-foot{padding:9px 16px 12px; color:var(--mute); font-size:var(--fs-1); line-height:1.5}
@media(max-width:760px){
  .labx-top{padding:12px 12px 9px}
  .labx-topicbar{align-items:stretch}
  .labx-topic{flex:1 1 100%}
  .labx-topic-search{height:36px}

  .labx-kpi:nth-child(2n){border-right:0}

  .labx-chart{padding:10px 12px 0}

  .labx-chart-axis{font-size:10px; gap:2px}
  .labx-compare{padding:10px 12px 0; margin-top:10px}
  .labx-compare-add{height:36px; font-size:var(--fs-2)}
  .labx-compare-menu{width:min(280px, calc(100vw - 48px)); max-height:40vh}
  .labx-table-head{padding:10px 12px 8px; align-items:flex-start; flex-wrap:wrap}

  .labx{font-size:var(--fs-4)}

  .labx-table{font-size:var(--fs-3)}

/* 跨平台新增话题弹层（2026-11-13）：
   桌面双页共用；入口在壳顶栏，页面只负责收到消息后打开。 */
.topic-add-mask{
  position:fixed; inset:0; z-index:80; display:none; align-items:center;
  justify-content:center; padding:24px; background:rgba(34,50,78,.34);
  -webkit-backdrop-filter:blur(3px); backdrop-filter:blur(3px);
}
.topic-add-mask.on{display:flex}
.topic-add-modal{
  display:flex; flex-direction:column; width:min(760px,100%); max-height:88vh;
  background:var(--panel); color:var(--ink); border:1px solid var(--line2);
  border-radius:16px; box-shadow:0 20px 52px rgba(23,36,58,.18); overflow:hidden;
}
.topic-add-head{
  display:flex; align-items:flex-start; justify-content:space-between; gap:12px;
  padding:16px 18px 13px; border-bottom:1px solid var(--line2); flex:none;
}
.topic-add-kicker{font-size:10px; letter-spacing:.08em; color:var(--mute); margin-bottom:3px}
.topic-add-head h2{font:700 18px/1.25 var(--sans); letter-spacing:-.02em; margin:0}
.topic-add-x{
  width:28px; height:28px; border:1px solid var(--line2); border-radius:8px;
  background:var(--panel2); color:var(--mute); font-size:19px; line-height:1;
  cursor:pointer; flex:none;
}
.topic-add-x:hover{border-color:var(--accent, #2f6feb); color:var(--accent, #2f6feb)}
.topic-add-body{padding:16px 18px 4px; overflow:auto; min-height:0}
.topic-add-sub{font-size:var(--fs-2); line-height:1.55; color:var(--mute); margin:0 0 12px}
.topic-add-search{display:flex; gap:8px}
.topic-add-search input{
  flex:1 1 auto; min-width:0; height:36px; padding:0 11px; font-size:var(--fs-3);
  color:var(--ink); background:var(--panel2); border:1px solid var(--line2);
  border-radius:9px; outline:none;
}
.topic-add-search input:focus{border-color:var(--accent, #2f6feb); background:var(--panel)}
.topic-add-status{font-size:var(--fs-2); line-height:1.5; color:var(--mute); margin:9px 0 8px}
.topic-add-results{max-height:240px; overflow:auto; margin:0 -2px 4px; padding:0 2px}
.topic-add-empty{padding:14px 10px; color:var(--mute); font-size:var(--fs-2); line-height:1.5; text-align:center}
.topic-add-group{margin-bottom:10px}
.topic-add-group-h{display:flex; align-items:baseline; gap:7px; padding:0 2px 5px; font-size:var(--fs-2)}
.topic-add-group-h b{font-weight:650; color:var(--ink)}
.topic-add-group-h span{color:var(--mute); font-size:var(--fs-1)}
.topic-add-row{
  display:flex; align-items:center; gap:8px; width:100%; margin:0 0 4px; padding:8px 9px;
  border:1px solid var(--line2); border-radius:9px; background:var(--panel2);
  color:var(--ink); text-align:left; cursor:pointer; font:inherit;
}
.topic-add-row:hover{border-color:var(--accent, #2f6feb); background:var(--panel)}
.topic-add-row.on{border-color:var(--accent, #2f6feb); background:color-mix(in srgb, var(--accent, #2f6feb) 7%, var(--panel))}
.topic-add-pf{flex:none; font-size:10px; line-height:1; padding:4px 6px; border-radius:5px; color:#fff; background:#2f6feb}
.topic-add-pf.xhs{background:#d64b86}
.topic-add-nm{flex:1 1 auto; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; font-size:var(--fs-3); font-weight:550}
.topic-add-val{flex:none; color:var(--mute); font-size:var(--fs-1)}
.topic-add-pick{flex:none; font-size:var(--fs-1); color:var(--accent, #2f6feb); min-width:34px; text-align:right}
.topic-add-field{margin:11px 0}
.topic-add-field label{display:block; font-size:var(--fs-2); font-weight:600; color:var(--ink); margin-bottom:5px}
.topic-add-field input{
  width:100%; height:36px; padding:0 10px; font-size:var(--fs-3); color:var(--ink);
  background:var(--panel2); border:1px solid var(--line2); border-radius:8px; outline:none;
}
.topic-add-field input:focus{border-color:var(--accent, #2f6feb); background:var(--panel)}
.topic-add-advanced{border-top:1px dashed var(--line2); padding-top:10px; margin-top:12px}
.topic-add-advanced summary{cursor:pointer; font-size:var(--fs-2); color:var(--mute); list-style:none}
.topic-add-advanced summary::-webkit-details-marker{display:none}
.topic-add-advanced summary:hover{color:var(--accent, #2f6feb)}
/* 已监控话题管理（2026-11-15）：「新增话题」弹层里的删除入口 */
.topic-add-manage{margin-top:9px}
.topic-add-mine{
  max-height:230px; overflow:auto; margin-top:8px;
  border:1px solid var(--line2); border-radius:9px; background:var(--panel2);
}
.topic-add-mine-h{
  display:flex; align-items:baseline; justify-content:space-between; gap:8px;
  padding:7px 10px 6px; border-bottom:1px solid var(--line2);
  font-size:var(--fs-1); color:var(--mute);
}
.topic-add-mine-h .bad{color:var(--down, #c9353f); text-align:right}
.topic-add-mine-row{
  display:flex; align-items:center; gap:8px; padding:7px 9px;
  border-bottom:1px solid var(--line2);
}
.topic-add-mine-row:last-child{border-bottom:none}
.topic-add-cat{
  flex:none; max-width:110px; overflow:hidden; text-overflow:ellipsis; white-space:nowrap;
  color:var(--mute); font-size:var(--fs-1);
}
.topic-add-rm{
  flex:none; margin-left:auto; padding:3px 9px; cursor:pointer;
  border:1px solid var(--down, #c9353f); border-radius:6px; background:transparent;
  color:var(--down, #c9353f); font:inherit; font-size:var(--fs-1);
}
.topic-add-rm:hover{background:var(--down, #c9353f); color:#fff}
.topic-add-pair{display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:0 12px}
.topic-add-err{min-height:18px; margin:4px 0 8px; color:var(--down, #c9353f); font-size:var(--fs-2); line-height:1.45}
.topic-add-foot{display:flex; align-items:center; gap:8px; padding:12px 18px 15px; border-top:1px solid var(--line2); flex:none}
.topic-add-foot [hidden]{display:none!important}
.topic-add-grow{flex:1 1 auto}
@media(max-width:760px){
  .topic-add-mask{align-items:flex-end; padding:0}
  .topic-add-modal{width:100%; max-height:92vh; border-radius:16px 16px 0 0}
  .topic-add-pair{grid-template-columns:1fr}

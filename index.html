/* ---------------- 每小时一档（2026-11-09 用户定） ----------------
   「跨度不足 1 小时的不显示」落到实现上就是：相邻两条快照间隔不足 1 小时的，
   不单独成一行 / 不成一段。云端补跑、手动「取一次」都会在同一小时里塞进第二条
   （实测 21:01 之后又落了 21:09 / 21:15 / 21:23 / 21:49），这些点既画不出趋势，
   「较上次」也只是几分钟里抖出来的数 —— 22:01 与 21:49 只差 12 分钟，
   却会被当成「一小时的增量」摆出来，最容易被看错。

   做法：**每小时只留一条**，优先分钟位 01–08 的准点快照，其次离整点最近的那条。
   这样曲线和明细取的是同一批点（口径一致），相邻两条恒为一小时左右。 */
function hourlyChain(list){
  const picks = new Map();
  for (const s of list){
    const h = Math.floor(s[0] / 3600), late = s[0] - h * 3600;
    const canon = late >= 60 && late <= 480;          // 分钟位 01–08 = 准点那一轮
    const cur = picks.get(h);
    if (!cur || (canon && !cur.canon) || (canon === cur.canon && late < cur.late)){
      picks.set(h, { s, canon, late });
    }
  }
  const out = [];
  const ordered = [...picks.entries()].sort((a, b) => a[0] - b[0]);
  for (const [, pick] of ordered){
    // out 里放的是快照本身（不是 pick 对象），比较时直接取 [0]
    const last = out[out.length - 1];
    // 兜底：整轮迟到时准点会缺，相邻两档可能仍不足 54 分钟 —— 准点优先，否则并掉
    if (last && pick.s[0] - last[0] < 3240){
      if (!pick.canon) continue;
      out.pop();
    }
    out.push(pick.s);
  }
  return out;
}

/* 图表窗口的末端必须是「准点档」的最后一条，而不是手工补采的 14:16 之类。
   2026-11-13 用户反馈「近 24 小时只有 23 个数据」：最新一条是 14:16 手动快照，
   窗口从 14:16 往前推，hourlyChain 又把它和 15:01 并掉，首柱被推到 16:01，
   24 个增量只剩 23 个。按准点链取末端，窗口就是 14:01→次日 14:01。 */
function chartEndTs(list){
  const clean = hourlyChain(list || []);
  if (clean.length) return clean[clean.length - 1][0];
  const all = (list || []).slice().sort((a, b) => a[0] - b[0]);
  return all.length ? all[all.length - 1][0] : 0;
}

/* 在 [from, to] 窗口里按小时档取点、按当前口径换成画图序列。

   2026-11-10 从 drawChart 里抽出来的：主线、昨天、对比话题三条线用的是同一套
   取点/换算规则，抽出来才不会哪天改了一处忘了另一处。mode='total' 每档都有值；
   'inc' 默认从第二档起才有，传 withLead 时借用窗口前最后一个准点档，首档也有增量。 */
function seriesWindow(list, from, to, mode, withLead){
  const pts = (list || []).filter(s => s[0] >= from && s[0] <= to).sort((a, b) => a[0] - b[0]);
  const hp = hourlyChain(pts);
  const out = [];
  /* 增量柱要画满窗口的 25 个整点快照：首条没有「上一档」，原来会少一根。
     从窗口前最后一个准点档借一个基准，首条也能画出一根柱（2026-11-13 用户定）。 */
  let lead = null;
  if (withLead && mode !== 'total' && hp.length >= 2){
    const before = (list || []).filter(s => s[0] < from).sort((a, b) => a[0] - b[0]);
    const lc = hourlyChain(before);
    lead = lc.length ? lc[lc.length - 1] : null;
  }
  for (let i = 0; i < hp.length; i++){
    if (mode === 'total') out.push({x: hp[i][0], v: hp[i][1]});
    else {
      const prev = i > 0 ? hp[i - 1] : lead;
      /* start = 这段区间的起点：柱跨度 > 1 小时时按起点归桶，
         跨桶那一根（23:xx→次日 00:xx）必须算前一个桶，否则会漏掉一整段。 */
      if (prev) out.push({x: hp[i][0], v: hp[i][1] - prev[1], start: prev[0]});
    }
  }
  return out;
}

/* 7 / 30 天档按本地自然日取点（2026-11-13 用户反馈「今天是太阳雨 11 月 8 日
   当天应该是 8.1 亿，柱状图显示 8.6 亿」）。长档原来把一天里的每个小时
   都画在线上，168 / 720 个点挤在手机宽度里，也看不出趋势。
   - 总量：每个自然日取当天首条整点快照（当天 0 点附近），x 对齐当天 0 点。
   - 增量：按「区间起点」归属自然日，累加相邻快照差值，x 仍是当天 0 点。
     跨日那一口（前一天 23:xx → 当天 00:xx）起点在前一天，算前一天；
     当天 23:xx → 次日 00:xx 起点在当天，算当天。只判「两端同一天」会把
     当天最后一小时漏到次日，太阳雨 11-08 就会少 0.28 亿（8.19→7.9）。 */
function localDayStart(ts){
  const d = new Date(ts * 1000);
  return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 1000;
}
function dailySeries(list, from, to, mode){
  const pts = (list || []).filter(s => s[0] >= from && s[0] <= to).sort((a, b) => a[0] - b[0]);
  const hp = hourlyChain(pts), out = [], sums = new Map(), firsts = new Map();
  for (let i = 0; i < hp.length; i++){
    const day = localDayStart(hp[i][0]);
    if (mode === 'total'){
      if (!firsts.has(day)) firsts.set(day, {v: hp[i][1], at: hp[i][0]});
    } else if (i > 0){
      /* 增量属于「上一档 → 这一档」这段区间，按起点日归属；
         这样 00:xx 的跨日增量归前一天，23:xx → 次日 00:xx 归当天。 */
      const startDay = localDayStart(hp[i - 1][0]);
      sums.set(startDay, (sums.get(startDay) || 0) + (hp[i][1] - hp[i - 1][1]));
    }
  }
  if (mode === 'total'){
    [...firsts.keys()].sort((a, b) => a - b).forEach(day => {
      const p = firsts.get(day);
      out.push({x: day, v: p.v, at: p.at});
    });
  } else {
    [...sums.keys()].sort((a, b) => a - b).forEach(day => {
      out.push({x: day, v: sums.get(day)});
    });
  }
  return out;
}

/* ---------------- 小时明细 ----------------
   曲线只能看形状，「具体几点涨了多少」得逐条看数字。这张表就是每次采集的原始值：
   总量（千分位完整值）后括号内为相对上一条的增量（2026-11-09 用户定；
   11-08 曾定过不显示增量列，后改为紧跟总量的括号形式）。
   小红书多一列讨论数（App 网关口径）——讨论数按整批时间戳单独采集，
   和浏览量快照差几分钟，按最近时间配对（±40 分钟内才算数）。
   时间下面的小字是距上一条的间隔，超过 4.5 小时标灰提示断档。
   倒序排列：最新的在最上面，点进来先看到当前值。 */
const WD = ['周日', '周一', '周二', '周三', '周四', '周五', '周六'];
function nearDiscuss(series, ts){
  if (!series || !series.length) return null;
  let best = null;
  for (let i = 0; i < series.length; i++){
    const p = series[i];
    if (best === null || Math.abs(p[0] - ts) < Math.abs(best[0] - ts)) best = p;
  }
  return best && Math.abs(best[0] - ts) <= 2400 ? best[1] : null;
}
function renderHourly(){
  const box = $('#hrBox'), cnt = $('#hrCnt'), sub = $('#hrSub');
  const t = D().rows.find(r => r.ch_id === S.sel);
  if (!t || !box) return;
  const isX = S.pf === 'xhs';
  const dl = isX ? (D().discuss || {})[S.sel] : null;
  const snaps = curSnaps().slice().sort((a, b) => a[0] - b[0]);
  const until = S.trendCustom ? S.trendCustom.to : (snaps.length ? snaps[snaps.length - 1][0] : 0);
  const since = S.trendCustom ? S.trendCustom.from : until - S.range * 86400;
  /* 每小时一档（见 hourlyChain）：同一小时里的补跑 / 手动快照只留准点那条，
     所以表里相邻两行恒为一小时左右，不会再冒出 +0.1h 这种行。 */
  const win = hourlyChain(snaps.filter(s => s[0] >= since && s[0] <= until));
  const leadChain = hourlyChain(snaps.filter(s => s[0] < since));
  const lead = leadChain.length ? leadChain[leadChain.length - 1] : null;
  const items = win.map((s, i) => ({ s, p: i > 0 ? win[i - 1] : lead }));
  sub.textContent = (S.trendCustom ? '自定义区间' : rangeName(S.range)) + ' · 每小时一档';
  cnt.textContent = items.length ? items.length + ' 档' : '';
  /* 2026-11-09 用户定：覆盖跨度不足 1 小时的明细不列（和上面曲线同一道闸）。
     只差几十分钟的两三条快照，增量是一小段里抖出来的数，拿它判断「涨没涨」会看错。 */
  const cover = items.length ? items[items.length - 1].s[0] - items[0].s[0] : 0;
  if (!items.length || cover < 3600){
    box.innerHTML = '<div class="empty">'
      + (items.length ? '跨度不足 1 小时，明细先不列' : '这段范围里还没有快照') + '</div>';
    return;
  }
  items.reverse();                       // 最新在上
  let prevDay = '';
  const ncol = isX ? 4 : 3;
  const labelVal = isX ? '浏览量' : '播放量';
  const labelPart = isX ? '笔记数' : '参与人数';
  const trs = items.map(({ s, p }) => {
    const gap = p ? (s[0] - p[0]) / 3600 : null;
    const dt = new Date(s[0] * 1000);
    const dayK = (dt.getMonth() + 1) + '.' + String(dt.getDate()).padStart(2, '0');
    let head = '';
    if (dayK !== prevDay){
      prevDay = dayK;
      head = '<tr class="day"><td colspan="' + ncol + '">' + dayK + ' ' + WD[dt.getDay()] + '</td></tr>';
    }
    const cut = gap != null && gap > 4.5;
    /* 2026-11-09 用户定：明细里三个数据列都显示完整数值（千分位），不要万/亿缩写；
       总量后面括号写相对上一条采集的增量（2026-11-09）。首条没有上一条，不写括号。 */
    const inc = (cur, prev) => (cur != null && prev != null)
      ? ' (' + (cur - prev >= 0 ? '+' : '−') + Math.abs(cur - prev).toLocaleString('en-US') + ')'
      : '';
    const pdv = (isX && p) ? nearDiscuss(dl, p[0]) : null;
    const dv = isX ? nearDiscuss(dl, s[0]) : null;
    return head + '<tr>'
      + '<td class="t"><b>' + tsLabel(s[0]) + '</b><i'
      + (cut ? ' class="cut" title="距上一条 ' + gap.toFixed(1) + ' 小时，中途断档"' : '') + '>'
      + (gap == null ? '首条' : '+' + gap.toFixed(1) + 'h') + '</i></td>'
      + '<td data-label="' + labelVal + '">' + num(s[1]) + inc(s[1], p ? p[1] : null) + '</td>'
      + '<td data-label="' + labelPart + '">' + (s.length > 2 && s[2] != null
            ? num(s[2]) + inc(s[2], p && p.length > 2 ? p[2] : null) : '—') + '</td>'
      + (isX ? '<td data-label="讨论数">' + (dv != null ? num(dv) + inc(dv, pdv) : '—') + '</td>' : '')
      + '</tr>';
  }).join('');
  box.innerHTML = '<table class="hr-tbl"><thead><tr><th>时间</th><th>'
    + labelVal + '</th><th>'
    + labelPart + '</th>'
    + (isX ? '<th>讨论数</th>' : '') + '</tr></thead><tbody>' + trs + '</tbody></table>';
}
/* 要画的线，顺序即配色顺序（2026-11-10 用户定，和桌面监控台同一套口径）：
     主线（实线 / 面积 / 画点）→ 昨天（同色虚线）→ 对比话题（异色虚线）。
   三条线都走 seriesWindow，取点与换算只此一份，不会改了一处忘另一处。
   对照组是参照物：不填面积、不画点、线更细，不能抢主线的注意力。 */
function chartList(){
  const out = [];
  const t = D().rows.find(r => r.ch_id === S.sel);
  if (!t) return out;
  const snaps = curSnaps().slice().sort((a, b) => a[0] - b[0]);
  if (!snaps.length) return out;
  /* 窗口末端用准点档：手动补采的 14:16 不能当 24 小时的终点，否则会少一格。 */
  const to = S.trendCustom ? S.trendCustom.to : chartEndTs(snaps);
  /* 快捷档的起点要落到整点，不能是「14:01:25 − 24h」这种精确秒：
     昨天的 14:01:19 会差 6 秒被裁掉，24 个增量就只剩 23 个。 */
  const from = S.trendCustom ? S.trendCustom.from
                             : Math.floor((to - S.range * 86400) / 3600) * 3600;
  /* 2026-11-16 柱跨度：7 / 30 天档选了比 1 天更短的跨度时，不能先按天合成 ——
     dailySeries 会把 168 个小时压成 7 个日点，drawChart 再分 2 / 4 / 12 小时桶就没数据了。
     所以只要「增量 + 柱状 + 跨度 < 1 天」就走逐小时取点，再由 drawChart 按所选跨度分桶；
     曲线模式仍按天取点（长档折线用不到 168 个点）。 */
  const hourlyBars = S.mode === 'inc' && S.shape === 'bar' &&
    barSpanSecOf(S.range, S.barSpan) < 86400;
  const longRange = S.range >= 7 && !hourlyBars;
  const main = longRange
    ? dailySeries(snaps, from, to, S.mode)
    : seriesWindow(snaps, from, to, S.mode, true);
  if (!main.length) return out;
  /* 叠加小红书时图例不用「右轴」：两条线直接用平台名区分。
     没有叠加时仍显示话题名，图例保持原来的可读性。 */
  const mainName = S.cmpXhs ? (S.pf === 'xhs' ? '小红书' : '抖音') : t.name;
  out.push({name: mainName, pts: main, ci: 0, dash: false, kind: 'main'});
  if (S.cmpYday){
    /* 「昨天」= 把窗口整体往前挪一天取点，再把时间戳挪回来，叠在同一段横轴上。
       86400 是 3600 的整数倍，整点档不会错位；两条线形状一致才谈得上「今天比昨天猛不猛」。
       2026-11-10 用户反馈「最新一档不显示昨天」：上界原来是 to-86400 的**精确秒**，
       而昨天同一档的采集时刻常比今天晚几十秒/几分钟（实测晚 18 秒），那个点就被裁掉了。
       改成昨天同一整点档的末尾，再把挪回来的 x 钳到 to —— 仍是同一档，
       折线不会画到右边界之外，柱状分档也不变。 */
    const yTo = Math.floor((to - 86400) / 3600) * 3600 + 3599;
    const yRaw = longRange
      ? dailySeries(snaps, from - 86400, yTo, S.mode)
      : seriesWindow(snaps, from - 86400, yTo, S.mode, true);
    const y = yRaw.map(p => ({
      x: Math.min(p.x + 86400, to),
      v: p.v,
      at: p.at != null ? p.at + 86400 : undefined,
    }));
    if (y.length) out.push({name: mainName + ' · 昨天', pts: y, ci: 0, dash: true, kind: 'yday'});
  }
  /* 对比话题：只保留 chips 里那一个入口，图表仍要画异色虚线；
     这里和主线共用 from/to，自定义日期也同步裁剪。 */
  const cid = S.cmpTopic;
  if (cid && cid !== S.sel){
    const cs = ((D().history || {})[cid] || []).slice().sort((a, b) => a[0] - b[0]);
    const cp = cs.length ? (longRange
      ? dailySeries(cs, from, to, S.mode)
      : seriesWindow(cs, from, to, S.mode, true)) : [];
    if (cp.length){
      const ct = D().rows.find(r => r.ch_id === cid);
      out.push({name: (ct ? ct.name : cid) + ' · 对比', pts: cp, ci: 1, dash: true, kind: 'cmp'});
    }
  }
  /* 叠加小红书（2026-11-14 同步桌面端）：同名异平台话题的指标
     （dy 台叠小红书浏览量，xhs 台叠抖音播放量）。App 不连服务端，
     另一侧数据由 ensureOverlayData 懒加载进 S.overlayCache 后这里同步取用；
     没加载到（还没取完 / 取失败）就先不画，开关下次重画会再试。
     固定粉色实线（kind='xhs'，drawChart 单独给它配色）；右侧独立纵轴，
     按各自量级缩放，绝对值可以直接对照。 */
  if (S.cmpXhs){
    const other = S.pf === 'xhs' ? 'dy' : 'xhs';
    const ov = (S.overlayCache || {})[other];
    if (ov){
      const nm = (t.name || '').trim();
      const ot = (ov.topics || []).find(x => ((x.name || '').trim() === nm)
        && (other === 'xhs' ? x.page_id : x.ch_id));
      if (ot){
        const key = String(other === 'xhs' ? ot.page_id : ot.ch_id);
        const cs = ((ov.history || {})[key] || []).slice().sort((a, b) => a[0] - b[0]);
        const cp = cs.length ? (longRange
          ? dailySeries(cs, from, to, S.mode)
          : seriesWindow(cs, from, to, S.mode, true)) : [];
        if (cp.length) out.push({name: other === 'xhs' ? '小红书' : '抖音',
                                 pts: cp, ci: 4, dash: false, kind: 'xhs'});
      }
    }
  }
  return out;
}

/* 另一侧平台的 topics + history 懒加载（叠加小红书用）。文件不小
   （history ~200KB gz），只在开开关时取一次，缓存进 S.overlayCache。 */
async function ensureOverlayData(){
  const other = S.pf === 'xhs' ? 'dy' : 'xhs';
  if (S.overlayCache[other]) return S.overlayCache[other];
  const topics = other === 'xhs' ? await readJson('xhs_topics.json') : (await githubTopics()).list;
  const history = other === 'xhs' ? await readJsonGz('xhs_history.json.gz')
                                  : await readJsonGz('history.json.gz');
  S.overlayCache[other] = {topics, history};
  return S.overlayCache[other];
}

/* 图形可以手动切（2026-11-10 用户定）：shape = auto 沿用原规则 / bar 强制柱状 / line 强制曲线。
   auto 下：一天以内的增量用柱状（增量是每档独立的量，折线连出来的斜线是编造的），
   且只允许单线或「+对比昨天」；对比话题是另一条异色异量级的线，仍走折线。
   手动选 bar 时不再限制档位 / 条数：长档画密集细柱，多线按整点档分组并排。
   总量是累计值，本来就连续，一律曲线。单独拎出来是为了能被自检脚本直接测。 */
function barModeOf(mode, range, lines, shape){
  const L = lines || [];
  if (mode === 'total' || shape === 'line') return false;
  if (shape === 'bar') return true;
  if (range > 1) return false;
  if (L.length === 1) return L[0].kind !== 'yday';
  return L.length === 2
    && L.some(s => s.kind === 'yday')
    && L.some(s => s.kind !== 'yday');
}

function drawChart(targetCv, targetW, targetH, targetDpr){
  const t = D().rows.find(r => r.ch_id === S.sel); if (!t) return;
  const outCv = (targetCv && typeof targetCv.getContext === 'function') ? targetCv : $('#chart');
  const dpr = targetDpr || Math.min(2, window.devicePixelRatio || 1);
  const W = targetW || outCv.clientWidth || 320, H = targetH || outCv.clientHeight || 210;
  outCv.width = W * dpr; outCv.height = H * dpr;
  const g = outCv.getContext('2d');
  g.setTransform(dpr, 0, 0, dpr, 0, 0);   // 改过画布尺寸后 transform 会回到单位阵，每轮重设一次
  g.clearRect(0, 0, W, H);
  const css = getComputedStyle(document.body);
  const cssv = (k, d) => css.getPropertyValue(k).trim() || d;
  const LINE = cssv('--line', '#e3eaf3'), INK = cssv('--ink', '#17243a');
  const ACC = cssv('--accent', '#2f6feb'), CMP = cssv('--cmp', '#d9663a');
  const DOWN = cssv('--down', '#12a170');   // 跌色：柱状图里向下那根用它
  const lg = $('#chLegend'), sub = $('#chSub'), hint = $('#chHint');
  // 2026-11-09 用户定：曲线按「整点档」画 —— 每小时一档，优先准点那条（见 hourlyChain / seriesWindow），
  // 和「小时明细」取的是同一批点。旧写法取「该小时最后一条」：21:01 之后补跑的
  // 21:49 会顶掉 21:01，于是 21:49→22:01 这 12 分钟被当成一档画上去，曲线跟着假跌。
  const lines = chartList();
  const main = lines[0] || null;
  const drawnSpan = main ? main.pts[main.pts.length - 1].x - main.pts[0].x : 0;
  /* 增量序列的第一条是「首快照 → 第二快照」的差值，画在第二快照上，
     所以点集天然比窗口少 1 小时。轴起点要回到窗口首快照，否则「近 24 小时」
     会缩成 23 小时（2026-11-13 用户反馈）。 */
  const rawLast = chartEndTs(curSnaps());
  const winFrom = S.trendCustom ? S.trendCustom.from : rawLast - S.range * 86400;
  /* 2026-11-09 用户定：跨度（首点到末点）不足 1 小时就不画 —— 刚加的话题只有两三个点，
     连出来是贴在右边的一条短线，看不出任何趋势，还容易被当成图画坏了。
     判据只看主线：对照组有没有数据不该决定主图能不能画。 */
  if (!main || main.pts.length < 2 || drawnSpan < 3600){
    g.fillStyle = INK; g.font = '12px sans-serif'; g.textAlign = 'left';
    g.fillText(!main ? '这个范围里还没有数据' : '跨度不足 1 小时，先不画曲线', 10, H / 2);
    lg.classList.remove('on'); lg.innerHTML = '';
    sub.textContent = '';
    chartGeo = null;
    renderTrendRange(null, null); renderTrendStats();
    return;
  }
  const barMode = barModeOf(S.mode, S.range, lines, S.shape);
  /* 2026-11-16 用户定「趋势曲线增加每根柱状图跨度选项」：
     1 / 2 / 4 / 6 / 12 / 24 小时，auto 沿用 2026-11-10 的规则
     （3 天以上按本地自然日、其余按整点小时）。2 小时以上的桶对齐本地 0 点再切。
     dayBar 只代表 1 天桶，文案（柱高含义 / 首末日偏低）仍按它判断。 */
  const barSpan = barMode ? barSpanSecOf(S.range, S.barSpan) : 3600;
  const localDay = t => {
    const d = new Date(t * 1000);
    return new Date(d.getFullYear(), d.getMonth(), d.getDate()).getTime() / 1000;
  };
  const bucketOf = t => bucketStartOf(t, barSpan, localDay);
  const dayBar = barMode && barSpan === 86400;
  /* 聚合后时间戳变成桶起点，先把窗口真实边界存下来，横轴刻度仍按自然日生成。 */
  let rawTmin = Infinity, rawTmax = -Infinity;
  if (barMode && barSpan !== 3600) {
    lines.forEach(s => {
      const per = new Map();
      s.pts.forEach(p => {
        if (p.x < rawTmin) rawTmin = p.x;
        if (p.x > rawTmax) rawTmax = p.x;
        /* 按区间起点归桶（seriesWindow 的 start）：跨桶那根算前一个桶。
           按天取点的长档没有 start，回落到 x。 */
        const start = p.start == null ? p.x : p.start;
        const k = bucketOf(start); per.set(k, (per.get(k) || 0) + p.v);
      });
      s.pts = [...per.keys()].sort((a, b) => a - b).map(k => ({x: k, v: per.get(k)}));
    });
  }
  const hasOverlay = lines.some(s => s.kind === 'xhs');
  /* 叠加另一平台时右侧要留出独立刻度；不叠时仍保持原来的紧凑留白。 */
  const padL = 52, padR = hasOverlay ? 58 : 10, padT = 10, padB = 22;
  // 横纵范围：时间取所有线（含对照线），数值只取左轴的主线；
  // 叠加小红书走右轴，不能把它的量级混进来把播放量压成平线。
  let tmin = Infinity, tmax = -Infinity, vmin = Infinity, vmax = -Infinity;
  lines.forEach(s => s.pts.forEach(p => {
    if (p.x < tmin) tmin = p.x;
    if (p.x > tmax) tmax = p.x;
  }));
  const mainAxisLines = lines.filter(s => s.kind !== 'xhs');
  const axisLines = mainAxisLines.length ? mainAxisLines : lines;
  axisLines.forEach(s => s.pts.forEach(p => {
    if (p.v < vmin) vmin = p.v;
    if (p.v > vmax) vmax = p.v;
  }));
  if (!dayBar && winFrom > 0 && winFrom < tmin) tmin = winFrom;
  if (barMode && barSpan !== 3600 && rawTmin < Infinity) { tmin = rawTmin; tmax = rawTmax; }
  /* 柱状必须从 0 起算：柱长就是量，不落地没法比高低。
     折线不能这样：总量从 0 起算会把 8.1 亿→8.6 亿压成贴顶的一条平线，
     增量里的正常回落也会被放大成深谷。折线改成按数据跨度上下留 8%，
     「上下纵深更大」的同时不制造虚假的暴跌。 */
  if (barMode){
    vmin = Math.min(vmin, 0);
    /* 有倒扣时给零线下面留一点位置：不留的话那根绿柱的柱尖正好顶在画布底边，
       看着像被切掉了。全为正时 vmin 就是 0，柱子贴底才是标准的柱状图。 */
    // 负值时只留「自身幅度的 25%」和「跨度的 3%」里大的那个：按跨度 8% 留，一根几万的
    // 倒扣会把底部掏空几十万，柱子被压扁、纵轴还跳出个「-45 万」
    if (vmin < 0) vmin -= Math.max(Math.abs(vmin) * 0.25, (vmax - vmin) * 0.03);
    vmax = Math.max(vmax, 0);
  } else {
    const span = vmax - vmin;
    const pad = span > 0 ? span * 0.08 : Math.max(1, Math.abs(vmax) * 0.01);
    vmin -= pad; vmax += pad;
  }
  if (vmax === vmin) vmax = vmin + 1;
  renderTrendRange(tmin, tmax);
  /* 柱状按「柱跨度」等距网格：默认一小时一格，缺格留空、首尾各留半格，
     间隙不再随漏采 / 补跑变化（2026-11-10 用户定）。折线仍按真实时间定位。
     横轴刻度也走同一个 X，所以柱子仍对得上整点数字。 */
  const g0 = bucketOf(tmin);
  const gN = Math.max(1, Math.round((bucketOf(tmax) - g0) / barSpan) + 1);
  const slotPx = (W - padL - padR) / gN;
  /* 柱状按「格」分组：同一格里的几条线并排成一组，组内留明显间隔
     （只隔 2px 会被读成「一根柱被压扁」，用户说的重叠）。组内顺序固定：
     浅色昨天最左、实色今天居中、异色对比话题最右；缺哪根就留空。 */
  const barKey = bucketOf;
  let barGeo = null;
  if (barMode) {
    /* 「叠加小红书」不进柱组（另一套量纲，混进播放量柱组没法读），
       柱画完之后以粉色实线叠在柱上方（见 barMode 分支末尾）。 */
    const rank = s => s.kind === 'yday' ? 0 : s.kind === 'cmp' ? 2 : 1;
    const ordered = lines.filter(s => s.kind !== 'xhs').sort((a, b) => rank(a) - rank(b));
    const idxOf = new Map(ordered.map((s, i) => [s, i]));
    const nLine = ordered.length;
    const gap = nLine > 1 ? Math.max(3, Math.min(6, slotPx * 0.16)) : 0;
    const bw = Math.max(0.4, Math.min(18, (slotPx * 0.76 - gap * (nLine - 1)) / nLine));
    const groupW = bw * nLine + gap * (nLine - 1);
    const byKey = new Map();
    ordered.forEach(s => {
      const per = new Map();
      s.pts.forEach(p => per.set(barKey(p.x), p));
      per.forEach((p, k) => {
        if (!byKey.has(k)) byKey.set(k, []);
        byKey.get(k).push({s, p, i: idxOf.get(s)});
      });
    });
    barGeo = {bw, gap, groupW, byKey, key: barKey, nLine, dayBar,
              keys: [...byKey.keys()].sort((a, b) => a - b)};
  }
  const Xtime = t => padL + (t - tmin) / (tmax - tmin || 1) * (W - padL - padR);
  const X = barMode
    ? (t => padL + ((bucketOf(t) - g0) / barSpan + 0.5) * slotPx)
    : Xtime;
  const Y = v => H - padB - (v - vmin) / (vmax - vmin || 1) * (H - padT - padB);
  /* 右轴：只有叠加另一平台时存在。小红书/抖音各自按自己的量级缩放，
     粉色实线不再因为绝对值差距被压成一条贴着零线的横线。 */
  const overlayLines = lines.filter(s => s.kind === 'xhs');
  let Y2 = null, oTicks = [], oLabel = () => '';
  if (overlayLines.length) {
    let oMin = Infinity, oMax = -Infinity;
    overlayLines.forEach(s => s.pts.forEach(p => {
      if (p.v < oMin) oMin = p.v;
      if (p.v > oMax) oMax = p.v;
    }));
    let oSpan = oMax - oMin;
    if (!(oSpan > 0)) oSpan = Math.max(Math.abs(oMax) * 0.002, 1);
    const oPad = oSpan * 0.08;
    const oYMin = oMin - oPad, oYMax = oMax + oSpan * 0.08;
    Y2 = v => H - padB - (v - oYMin) / (oYMax - oYMin || 1) * (H - padT - padB);
    /* 右轴刻度取整数档（100 万、200 万…），不要把 370/277/183 这种
       等分出来的零碎数字写上，读起来比左轴费劲。 */
    const niceStep = range => {
      const exp = Math.floor(Math.log10(range));
      const f = range / Math.pow(10, exp);
      return (f < 1.5 ? 1 : f < 3 ? 2 : f < 7 ? 5 : 10) * Math.pow(10, exp);
    };
    let oStep = niceStep((oYMax - oYMin) / 4);
    for (let n = 0; n < 6; n++) {
      oTicks = [];
      for (let v = Math.ceil(oYMin / oStep) * oStep; v <= oYMax + oStep * 1e-6; v += oStep) {
        oTicks.push(v);
      }
      if (oTicks.length >= 3) break;
      oStep /= 2;
    }
    const oAbsMax = Math.max(Math.abs(oMin), Math.abs(oMax));
    const oUnit = oAbsMax >= 1e8 ? 1e8 : oAbsMax >= 1e4 ? 1e4 : 1;
    const oSuffix = oUnit === 1e8 ? ' 亿' : oUnit === 1e4 ? ' 万' : '';
    const oDec = oUnit === 1 ? 0 : (oStep / oUnit >= 1 ? 0 : oStep / oUnit >= 0.1 ? 1 : 2);
    oLabel = v => {
      const x = v / oUnit;
      return (Math.abs(x) >= 1e4 ? Math.round(x).toLocaleString('en-US') : x.toFixed(oDec)) + oSuffix;
    };
  }
  // 网格 + 纵轴
  g.strokeStyle = LINE; g.fillStyle = '#8391a6'; g.font = '10px sans-serif'; g.textAlign = 'right';
  for (let i = 0; i <= 3; i++){
    const v = vmin + (vmax - vmin) * i / 3, y = Math.round(Y(v)) + .5;
    g.beginPath(); g.moveTo(padL, y); g.lineTo(W - padR, y); g.stroke();
    g.fillText(unit(v), padL - 6, y + 3);
  }
  /* 右轴只标粉色叠加线的刻度，不另画横网格；图例直接用平台名区分。 */
  if (Y2) {
    g.textAlign = 'left'; g.textBaseline = 'middle';
    g.font = '10px sans-serif';
    oTicks.forEach(v => {
      const y = Math.round(Y2(v)) + .5;
      if (y < padT || y > H - padB) return;
      g.strokeStyle = '#d64b86'; g.globalAlpha = .55;
      g.beginPath(); g.moveTo(W - padR, y); g.lineTo(W - padR + 3, y); g.stroke();
      g.globalAlpha = 1; g.fillStyle = '#d64b86';
      g.fillText(oLabel(v), W - padR + 5, y);
    });
    g.textBaseline = 'alphabetic';
  }
  if (barMode){
    /* 柱状：整点档 k 就是这一组的位置，不再用各自的真实时间戳定位。
       「昨天」继承的是昨天的采集时刻，跟今天可能差几十分钟，直接 X(p.x) 会让两根柱
       落到相邻两格（错档），同格时又只隔 2px（看着像重叠）。 */
    const {bw, gap, groupW, byKey, keys} = barGeo;
    const y0 = Y(0);
    keys.forEach(k => {
      const left = X(k) - groupW / 2;   // 整组锚在格子中心（k 已是桶起点）
      byKey.get(k).forEach(({s, p, i}) => {
        const bx = left + i * (bw + gap);
        const y = Y(p.v), h = Math.max(1, Math.abs(y - y0));
        const top = p.v >= 0 ? y : y0;
        /* 对比话题必须用图例里的橙色；以前这里恒用 ACC，
           两条柱全蓝，只有图例是橙的（2026-11-22 用户截图反馈）。 */
        g.fillStyle = p.v < 0 ? DOWN : (s.ci ? CMP : ACC);
        g.globalAlpha = s.kind === 'yday' ? .34 : .9;
        g.beginPath();
        if (g.roundRect) g.roundRect(bx, top, bw, h, Math.min(2.5, bw / 2));
        else g.rect(bx, top, bw, h);
        g.fill();
      });
    });
    g.globalAlpha = 1;
    // 零线画重一点：柱子从哪根线起算，得一眼看出来
    const zy = Math.round(y0) + .5;
    g.strokeStyle = INK; g.globalAlpha = .28; g.lineWidth = 1;
    g.beginPath(); g.moveTo(padL, zy); g.lineTo(W - padR, zy); g.stroke();
    g.globalAlpha = 1; g.lineWidth = 1;
    /* 「叠加小红书」在柱状下以粉色实线叠在柱上方，X 走同一套档位网格。 */
    lines.filter(s => s.kind === 'xhs').forEach(s => {
      const yMap = Y2 || Y;
      g.strokeStyle = '#d64b86'; g.lineWidth = 2; g.lineJoin = 'round';
      g.beginPath();
      s.pts.forEach((p, i) => { const x = X(p.x), y = yMap(p.v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
    });
  } else {
    // 面积：多话题也各自铺一层低透明色，才看得出各自的体量；右轴叠加线不铺面积
    lines.forEach(s => {
      if(s.pts.length < 2 || vmin < 0 || s.kind === 'xhs') return;
      const pts = s.pts;
      g.beginPath();
      pts.forEach((p, i) => { const x = X(p.x), y = Y(p.v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.lineTo(X(pts[pts.length - 1].x), Y(vmin)); g.lineTo(X(pts[0].x), Y(vmin)); g.closePath();
      g.fillStyle = s.ci ? 'rgba(217,102,58,.08)' : 'rgba(47,111,235,.10)'; g.fill();
    });
    // 折线：主线先画，虚线后画（压在上面才看得见）；叠加小红书固定粉色实线
    lines.forEach(s => {
      const yMap = s.kind === 'xhs' && Y2 ? Y2 : Y;
      g.strokeStyle = s.kind === 'xhs' ? '#d64b86' : (s.ci ? CMP : ACC);
      g.lineWidth = s.dash ? 1.5 : 1.8;
      if (s.dash){ g.save(); g.setLineDash([5, 4]); g.globalAlpha = .9; }
      g.beginPath();
      s.pts.forEach((p, i) => { const x = X(p.x), y = yMap(p.v); i ? g.lineTo(x, y) : g.moveTo(x, y); });
      g.stroke();
      if (s.dash) g.restore();
    });
    // 点只画主线：对照组一天几十个点，点上去了就成了花斑，反倒看不清走向
    main.pts.forEach(p => {
      g.beginPath(); g.arc(X(p.x), Y(p.v), 2.6, 0, 7); g.fillStyle = ACC; g.fill();
    });
  }
  /* 横轴刻度只留数字（2026-11-10 用户定：不写「时」，只要数字）。
     刻度取整点、一天以内的短档不带日期；跨天档加日期，否则 7/30 天里同一小时会重复。
     2026-11-09 定的是取整点，这次只改标签文字，取点逻辑不动。 */
  g.fillStyle = '#8391a6'; g.textAlign = 'center';
  const spanH = Math.max(1, Math.ceil((tmax - tmin) / 3600));
  const longRange = S.range >= 7;
  let ticks;
  if (longRange) ticks = dayTicks(tmin, tmax);
  else {
    let stepH = Math.max(1, Math.round(spanH / 5));
    while ((Math.floor((tmax - tmin) / (stepH * 3600)) + 1) > 8) stepH *= 2;  // 标签太多就加密步长
    const hStep = stepH * 3600;
    /* 起点必须落在窗口第一根柱/第一个点的整点档上。
       原来从 Math.ceil(tmin/hStep) 起，07:01 的第一格会被算成 08，
       最左边那根柱就永远没有横轴时间。 */
    const firstH = Math.floor(tmin / 3600) * 3600;
    ticks = [];
    for (let tk = firstH; tk <= tmax; tk += hStep) ticks.push(tk);
    const lastH = Math.floor(tmax / 3600) * 3600;
    if (ticks.length && lastH > ticks[ticks.length - 1] &&
        lastH - ticks[ticks.length - 1] >= hStep / 2) ticks.push(lastH);
  }
  // 刻度仍每天一条，标签太密时从右往左按整数天抽稀：右边界一定有，且间隔均匀
  const labelEvery = longRange ? Math.max(1, Math.ceil(ticks.length * 36 / (W - padL - padR))) : 1;
  const mdOf = tk => {
    const d = new Date(tk * 1000), p = n => String(n).padStart(2, '0');
    return p(d.getMonth() + 1) + '-' + p(d.getDate());
  };
  const crossDay = new Date(tmin * 1000).toDateString() !== new Date(tmax * 1000).toDateString();
  ticks.forEach((tk, i)=>{
    if((ticks.length - 1 - i) % labelEvery === 0){
      // 首尾给日期而不是小时，才看得出这一段跨了哪两天（参考图的横轴就是两个日期）
      const edgeDate = !longRange && crossDay && (i === 0 || i === ticks.length - 1);
      g.fillText(edgeDate ? mdOf(tk) : xAxisLabel(tk, S.range > 1, longRange), X(tk), H - 6);
    }
  });
  /* 图例：只有叠了对照线才出现，单线时不占地方。
     图例和曲线同源（都走 chartList），颜色才不会有一天对不上。 */
  if (lines.length > 1){
    lg.innerHTML = lines.map(s => '<span style="color:' + (s.kind === 'xhs' ? '#d64b86' : (s.ci ? CMP : ACC)) + '">'
      + (barMode
        ? '<i class="bar' + (s.kind === 'yday' ? ' dim' : '') + '"></i>'
        : '<i' + (s.dash ? '' : ' class="solid"') + '></i>')
      + stEsc(s.name) + '</span>').join('');
    lg.classList.add('on');
  } else { lg.classList.remove('on'); lg.innerHTML = ''; }
  // 说明
  const dataAt = chartEndTs(curSnaps()) || D().at;
  const dailyNote = S.range >= 7 && !barMode
    ? (S.mode === 'total' ? ' · 按自然日取当天首条快照' : ' · 按自然日汇总（不含跨日首段）')
    : '';
  /* 柱状并排说明按实际存在的线生成：只有对比话题时不能再写「左浅（昨天）」。
     浅蓝只在勾了「对比昨天」时存在；对比话题固定用橙色，和左上图例同色。 */
  const barSeries = lines.filter(s => s.kind !== 'xhs');
  const barHasYday = barSeries.some(s => s.kind === 'yday');
  const barHasCmp = barSeries.some(s => s.kind === 'cmp');
  const barUnit = dayBar ? '天' : barSpan === 3600 ? '档' : (barSpan / 3600) + ' 小时';
  const barColorParts = [];
  if (barHasYday) barColorParts.push('浅蓝=昨天');
  barColorParts.push('蓝=今天');
  if (barHasCmp) barColorParts.push('橙=对比');
  const barGroupNote = barSeries.length > 1
    ? ' · 每' + barUnit + '并排（' + barColorParts.join('、') + '）'
    : '';
  sub.textContent = (dataAt ? '数据截至 ' + fmtDataAt(dataAt) + ' · ' : '')
    + (barMode
    ? (dayBar ? '柱高 = 当天各小时增量之和，纵轴单位「万」'
              : barSpan === 3600 ? '柱高 = 那一小时的增量，纵轴单位「万」'
              : '柱高 = 每 ' + (barSpan / 3600) + ' 小时各档增量之和，纵轴单位「万」')
      + barGroupNote
    : S.mode === 'inc'
      ? '每个点是相对上一整点档的增量，纵轴单位「万」'
      : '累计播放量快照')
    + dailyNote
    + (!barMode && lines.length > 1 ? ' · 含 ' + (lines.length - 1) + ' 条对照线' : '');
  const hasY = lines.some(s => s.ci === 0 && s.dash);
  const hasC = lines.some(s => s.kind === 'cmp');
  const tips = [];
  if (S.cmpYday) tips.push(hasY
    ? (barMode ? '浅色柱是昨天同一档' : '「昨天」= 主线整条往前挪 24 小时，同色虚线')
    : '「昨天」这个范围里没数据（历史不足一天）');
  if (S.cmpTopic) tips.push(hasC ? (barMode ? '橙色柱 = 对比话题' : '异色虚线 = 对比话题')
                                : '对比话题在这个范围里没数据');
  if (S.cmpXhs){
    const hasX = lines.some(s => s.kind === 'xhs');
    const otherName = S.pf === 'xhs' ? '抖音' : '小红书';
    tips.push(hasX
      ? '粉色线 = 同名' + otherName + '话题的' + (S.pf === 'xhs' ? '播放量' : '浏览量')
        + '（粉色走右侧坐标，两侧各自按自己的量级缩放）'
      : '同名' + otherName + '话题在这个范围里没数据（可能另一侧还没加这个话题）');
  }
  hint.textContent = (barMode
    ? (dayBar
        ? '零线以上是涨，绿色向下的是倒扣；按本地自然日分档，窗口首末两天可能不足 24 小时'
        : barSpan === 3600
          ? '零线以上是涨，绿色向下的是倒扣；「图形」可随时切回曲线，7 天/30 天档柱子会很细'
          : '零线以上是涨，绿色向下的是倒扣；按本地 0 点对齐分桶，窗口首末桶可能不足 ' + (barSpan / 3600) + ' 小时；「柱跨度」可改')
    : '断口表示那段时间没采到数据，点「总量/增量」切口径、「图形」切柱状/曲线')
    + (tips.length ? '。' + tips.join('；') : '') + '。';
  /* 2026-11-12：把这一帧的几何存下来，pointer 事件靠它反查横坐标。
     范围/口径切换后旧 hover 可能落在窗口外，先丢掉再存。
     2026-11-14：拖拽缩放也要 invX（像素 → 时间戳），一并存。 */
  if(S.hover != null && (S.hover < tmin || S.hover > tmax)) S.hover = null;
  const invX = barMode
    ? (x => g0 + ((x - padL) / slotPx - 0.5) * barSpan)
    : (x => tmin + (x - padL) / ((W - padL - padR) || 1) * (tmax - tmin));
  chartGeo = {lines, X, Y, Y2, overlay: hasOverlay, invX, W, H, padL, padR, padT, padB, barMode, barGeo, tmin, tmax};
  /* 拖拽选区（缩放预览）：半透明竖带画在最上层 */
  if(chartDrag){
    const xa = Math.min(chartDrag.x0, chartDrag.x1), xb = Math.max(chartDrag.x0, chartDrag.x1);
    g.fillStyle = hexA(INK, .07);
    g.fillRect(xa, padT, xb - xa, H - padT - padB);
    g.strokeStyle = INK; g.globalAlpha = .4; g.lineWidth = 1; g.setLineDash([4, 4]);
    g.strokeRect(Math.round(xa) + .5, padT + .5, Math.round(xb - xa), H - padT - padB);
    g.setLineDash([]); g.globalAlpha = 1;
  }
  renderTrendStats();
  paintChartHover(g);
}

/* ---------------- 曲线点击/悬停（2026-11-12） ----------------
   手机上原来这张图是完全死的：没有 hover，也没有点击反馈。
   现在 tap 一下出竖向准线 + 最近一档的点，并弹一个小浮层给数值；
   桌面鼠标移动同样生效。浮层不挡手势：canvas 仍是 touch-action:pan-y。 */
function paintChartHover(g){
  const geo = chartGeo;
  if(!geo || S.hover == null) return;
  const x = geo.X(S.hover);
  if(!(x >= geo.padL - 1 && x <= geo.W - geo.padR + 1)) return;
  g.save();
  g.strokeStyle = '#17243a'; g.globalAlpha = .22; g.lineWidth = 1; g.setLineDash([3, 4]);
  g.beginPath();
  g.moveTo(Math.round(x) + .5, geo.padT);
  g.lineTo(Math.round(x) + .5, geo.H - geo.padB);
  g.stroke();
  g.restore();
  geo.lines.forEach(s => {
    let p = null, d = Infinity;
    s.pts.forEach(q => { const dd = Math.abs(q.x - S.hover); if(dd < d){ d = dd; p = q; } });
    if(!p) return;
    const yMap = s.kind === 'xhs' && geo.Y2 ? geo.Y2 : geo.Y;
    g.beginPath(); g.arc(geo.X(p.x), yMap(p.v), 4.2, 0, 7);
    g.fillStyle = '#fff'; g.fill();
    g.strokeStyle = s.kind === 'xhs' ? '#d64b86' : (s.ci ? '#d9663a' : '#2f6feb');
    g.lineWidth = 1.8; g.stroke();
  });
}
function chartSnap(clientX){
  const geo = chartGeo, cv = $('#chart');
  if(!geo || !cv) return null;
  const x = clientX - cv.getBoundingClientRect().left;
  if(x < geo.padL - 8 || x > geo.W - geo.padR + 8) return null;
  let best = null;
  geo.lines.forEach(s => s.pts.forEach(p => {
    const dx = Math.abs(geo.X(p.x) - x);
    if(!best || dx < best.dx) best = {dx, ts: p.x};
  }));
  return best ? best.ts : null;
}
function showChartTip(ts, clientX, clientY){
  const tip = $('#chTip'), geo = chartGeo, cv = $('#chart');
  if(!tip || !geo || !cv) return;
  const rows = [];
  let tipAt = ts;
  geo.lines.forEach(s => {
    let p = null, d = Infinity;
    s.pts.forEach(q => { const dd = Math.abs(q.x - ts); if(dd < d){ d = dd; p = q; } });
    if(!p) return;
    if (tipAt === ts && p.at != null) tipAt = p.at;   // 按自然日取点时，提示真实快照时刻
    rows.push('<div class="tr"><span><i style="background:' +
      (s.ci ? '#d9663a' : '#2f6feb') + '"></i>' + stEsc(s.name) + '</span><em>' +
      unit(p.v) + '</em></div>');
  });
  if(!rows.length){ tip.hidden = true; return; }
  tip.innerHTML = '<b>' + stEsc(labClock(tipAt)) + '</b>' + rows.join('');
  tip.hidden = false;
  const card = cv.parentElement.getBoundingClientRect();
  let left = clientX - card.left + 14, top = clientY - card.top - 10;
  if(left + tip.offsetWidth > card.width - 6) left = clientX - card.left - tip.offsetWidth - 14;
  if(left < 6) left = 6;
  if(top < 6) top = 6;
  if(top + tip.offsetHeight > card.height - 6) top = card.height - tip.offsetHeight - 6;
  tip.style.left = left + 'px'; tip.style.top = top + 'px';
}
function hideChartTip(){ const t = $('#chTip'); if(t) t.hidden = true; }
function chartPointer(e){
  const ts = chartSnap(e.clientX);
  if(ts == null){
    hideChartTip();
    if(S.hover != null){ S.hover = null; drawChart(); }
    return;
  }
  if(S.hover !== ts){ S.hover = ts; drawChart(); }
  showChartTip(ts, e.clientX, e.clientY);
}
/* ---------------- 拖拽缩放（2026-11-14 同步桌面端） ----------------
   图上横向拖一段 → 放大到该区间（写进 S.trendCustom，与日期控件同一套状态，
   App 数据全在内存，缩放零网络请求）；双击复位回最近快捷档；
   选区不足 10 分钟当误触忽略。没拖动 = tap，走原来的点击提示。 */
(function bindChartPointer(){
  const cv = $('#chart');
  if(!cv) return;
  let drag = null;
  cv.addEventListener('pointerdown', e => {
    if(!chartGeo || e.button > 0) return;
    const r = cv.getBoundingClientRect();
    const x = e.clientX - r.left;
    if(x < chartGeo.padL || x > chartGeo.W - chartGeo.padR) return;
    drag = {x0: x, x1: x, id: e.pointerId, moved: false};
    try{ cv.setPointerCapture(e.pointerId); }catch(err){}
    e.preventDefault();
  });
  cv.addEventListener('pointermove', e => {
    if(drag && (e.pointerId === drag.id || e.pointerType === 'mouse')){
      const r = cv.getBoundingClientRect();
      const x = Math.max(chartGeo.padL, Math.min(chartGeo.W - chartGeo.padR, e.clientX - r.left));
      drag.x1 = x;
      if(Math.abs(x - drag.x0) > 8) drag.moved = true;
      if(drag.moved){
        hideChartTip();
        if(S.hover != null){ S.hover = null; }
        chartDrag = drag;
        drawChart();
        return;
      }
    }
    if(e.pointerType === 'mouse' || e.buttons) chartPointer(e);
  });
  const endDrag = e => {
    const d = drag;
    drag = null;
    chartDrag = null;
    if(!d || !chartGeo){ hideChartTip(); return; }
    if(!d.moved){ chartPointer(e); return; }   // 没拖动 = tap，走原来的点击提示
    const xa = Math.min(d.x0, d.x1), xb = Math.max(d.x0, d.x1);
    if(xb - xa < 24){ drawChart(); return; }
    let from = chartGeo.invX(xa), to = chartGeo.invX(xb);
    if(to < from) [from, to] = [to, from];
    from = Math.max(0, Math.round(from)); to = Math.round(to);
    if(to - from < 600){ drawChart(); return; }  // 不足 10 分钟不缩放
    S.trendCustom = {from, to};
    S.range = Math.max(0.01, (to - from) / 86400);
    renderTrendQuick();
    drawChart();
    renderHourly();            // 明细表跟着同一档范围走
  };
  cv.addEventListener('pointerup', endDrag);
  cv.addEventListener('pointercancel', () => {
    drag = null; chartDrag = null;
    hideChartTip();
    if(S.hover != null){ S.hover = null; drawChart(); }
  });
  cv.addEventListener('pointerleave', e => {
    if(e.pointerType !== 'mouse' || drag) return;
    hideChartTip();
    if(S.hover != null){ S.hover = null; drawChart(); }
  });
  cv.addEventListener('dblclick', () => {

/* ---------------- 报表 ---------------- */
function mdLite(md){
  const inline = t => stEsc(t).replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>');
  const lines = md.split('\n');
  let out = '', i = 0;
  while (i < lines.length){
    const L = lines[i];
    if (/^\|/.test(L) && /^\|/.test(lines[i + 1] || '') && /-{2,}/.test(lines[i + 1])){
      const head = L.split('|').slice(1, -1).map(x => x.trim());
      i += 2;
      const rows = [];
      while (i < lines.length && /^\|/.test(lines[i])){
        rows.push(lines[i].split('|').slice(1, -1).map(x => x.trim())); i++;
      }
      out += '<table><thead><tr>' + head.map(h => '<th>' + inline(h) + '</th>').join('') + '</tr></thead><tbody>' +
        rows.map(r => '<tr>' + head.map((_, k) => '<td>' + inline(r[k] == null ? '' : r[k]) + '</td>').join('') + '</tr>').join('') +
        '</tbody></table>';
      continue;
    }
    if (/^### /.test(L)) out += '<h4>' + inline(L.slice(4)) + '</h4>';
    else if (/^## /.test(L)) out += '<h3>' + inline(L.slice(3)) + '</h3>';
    else if (/^# /.test(L)) out += '<h2>' + inline(L.slice(2)) + '</h2>';
    else if (/^[-*] /.test(L)) out += '<div class="rli">' + inline(L.slice(2)) + '</div>';
    else if (L.trim() !== '') out += '<p>' + inline(L) + '</p>';
    i++;
  }
  return out;
}

/* ---------------- 添加 / 移除话题（GitHub commit）---------------- */
function parseChId(raw){
  raw = (raw || '').trim();
  let m = raw.match(/\/hashtag\/(\d{6,25})/);
  if (m) return m[1];
  if (/^\d{6,25}$/.test(raw)) return raw;
  m = raw.match(/(?:^|\D)(\d{16,25})(?=\D|$)/);
  return m ? m[1] : '';
}
/* 小红书话题页 / App 分享文案 → 24 位 page_id。
   规则与 xhs_monitor.parse_page_id 对齐；App 分享链接里的 id 可能被双层编码。 */
function parseXhsPageId(raw){
  let s = String(raw || '').trim();
  for (let i = 0; i < 2; i++){
    try{
      const next = decodeURIComponent(s);
      if (next === s) break;
      s = next;
    }catch(e){ break; }
  }
  const pats = [
    /page\/topics\/([0-9a-fA-F]{24})/,
    /topic\/normal\/([0-9a-fA-F]{24})/,
    /[?&]ids=([0-9a-fA-F]{24})/,
    /[?&]id=([0-9a-fA-F]{24})/,
    /"ids"\s*:\s*"([0-9a-fA-F]{24})"/
  ];
  for (const p of pats){
    const m = s.match(p);
    if (m) return m[1].toLowerCase();
  }
  if (/^[0-9a-fA-F]{24}$/.test(s)) return s.toLowerCase();
  return '';
}
/* ---------------- 加话题：按名称搜索 ----------------
   App 不能直连桌面 8899；能连到时走本机服务，连不到时走搜狗找话题链接，
   再用平台详情接口核对官方名。找不到才退回贴链接。 */
function topicNameKey(raw){
  return String(raw || '').replace(/^#+/, '').replace(/\s+/g, '').trim().toLowerCase();
}
async function fetchTimed(url, opt, ms){
  const ctl = typeof AbortController === 'function' ? new AbortController() : null;
  const timer = ctl ? setTimeout(() => ctl.abort(), ms || 7000) : null;
  try{
    const r = await fetch(url, Object.assign({cache: 'no-store'}, opt || {},
      ctl ? {signal: ctl.signal} : {}));
    if (!r.ok) throw new Error('HTTP ' + r.status);
    return await r.text();
  } finally {
    if (timer) clearTimeout(timer);
  }
}
function addCandidate(out, seen, pf, id, name, value, source, added){
  id = String(id || '').trim();
  if (!id || !name) return;
  const key = pf + ':' + id;
  if (seen.has(key)) return;
  seen.add(key);
  out.push({pf, id, name: String(name), value: Number(value) || 0,
    source: source || '', added: !!added});
}
async function localNameCandidates(query){
  const out = [], seen = new Set();
  const q = topicNameKey(query);
  for (const pf of ['dy', 'xhs']){
    const d = S.data[pf] || {};
    for (const t of (d.topics || [])){
      const id = pf === 'dy' ? t.ch_id : t.page_id;
      const nm = t.name || '';
      if (q && topicNameKey(nm).indexOf(q) < 0) continue;
      addCandidate(out, seen, pf, id, nm, 0, '已有话题', true);
    }
  }
  /* 当前只加载了一个平台时，按需把两边仓库名单读出来；失败不挡搜索。 */
  const haveDy = out.some(x => x.pf === 'dy'), haveXhs = out.some(x => x.pf === 'xhs');
  if (CFG.token && (!haveDy || !haveXhs)){
    try{
      const [dy, xhs] = await Promise.all([githubTopics(), githubXhsTopics()]);
      for (const t of (dy.list || [])){
        if (q && topicNameKey(t.name).indexOf(q) < 0) continue;
        addCandidate(out, seen, 'dy', t.ch_id, t.name, 0, '已有话题', true);
      }
      for (const t of (xhs.list || [])){
        if (q && topicNameKey(t.name).indexOf(q) < 0) continue;
        addCandidate(out, seen, 'xhs', t.page_id, t.name, 0, '已有话题', true);
      }
    }catch(e){}
  }
  return out;
}

        'Origin': 'https://www.xiaohongshu.com', 'Referer': 'https://www.xiaohongshu.com/'},
        body: JSON.stringify({page_id: id})}, 7000);
    const d = JSON.parse(t);
    const info = d && d.success && d.data && d.data.page_info;
    if (!info || !info.name) return null;
    return {id: String(id), name: info.name, value: info.view_num};
  }catch(e){ return null; }
}
async function sogouCandidates(query, pf){
  const out = [], seen = new Set();
  const term = pf === 'dy'
    ? 'site:douyin.com/hashtag ' + query
    : 'site:xiaohongshu.com/page/topics ' + query;
  let body = '';
  try{
    body = await fetchTimed('https://www.sogou.com/web?query=' + encodeURIComponent(term),
      {headers: {'Accept-Language': 'zh-CN,zh;q=0.9'}}, 9000);
  }catch(e){ return out; }
  body = body.replace(/\\x2f/g, '/').replace(/\\\//g, '/');
  const ids = [];
  if (pf === 'dy'){
    const re = /douyin\.com\/hashtag\/([0-9]{10,25})/g;
    let m;
    while ((m = re.exec(body)) && ids.length < 8) ids.push(m[1]);
  } else {
    const re = /(?:page\/topics|topic\/normal|topic\/v2)\/([0-9a-fA-F]{24})/g;
    let m;
    while ((m = re.exec(body)) && ids.length < 8) ids.push(m[1].toLowerCase());
  }
  const uniq = [...new Set(ids)];
  if (pf === 'dy'){
    const infos = await Promise.all(uniq.slice(0, 6).map(id => douyinDetail(id)));
    for (const info of infos){
      if (info) addCandidate(out, seen, 'dy', info.id, info.name, info.value,
        '搜狗 + 抖音详情', false);
    }
  } else {
    const infos = await Promise.all(uniq.slice(0, 6).map(id => xhsDetail(id)));
    for (const info of infos){
      if (info) addCandidate(out, seen, 'xhs', info.id, info.name, info.value,
        '搜狗 + 小红书详情', false);
    }
  }
  return out;
}
async function searchTopicName(query){
  const out = [], seen = new Set();
  for (const row of await localNameCandidates(query)) addCandidate(out, seen,
    row.pf, row.id, row.name, row.value, row.source, row.added);
  const hasExact = pf => out.some(x => x.pf === pf && topicNameKey(x.name) === topicNameKey(query));
  if (!hasExact('dy') || !hasExact('xhs')){
    for (const row of await serverNameCandidates(query)) addCandidate(out, seen,
      row.pf, row.id, row.name, row.value, row.source, row.added);
  }
  if (!hasExact('dy') || !hasExact('xhs')){
    const need = ['dy', 'xhs'].filter(pf => !hasExact(pf));
    const got = await Promise.allSettled(need.map(pf => sogouCandidates(query, pf)));
    for (const r of got) if (r.status === 'fulfilled'){
      for (const row of r.value) addCandidate(out, seen, row.pf, row.id, row.name,
        row.value, row.source, row.added);
    }
  }
  return out;
}

      };

      if (pf === 'dy'){

        if (name && await putXhsTopics({removeName: name}) !== null) sides.push('小红书');

        !(r.pf !== pf && r.name === name));

    const box = $('#aManageBox');
    box.hidden = !box.hidden;
    if (!box.hidden) loadManage();
  };
}

async function githubTopics(){
  const r = await gh('/repos/' + CFG.repo + '/contents/topics.json?ref=main', {cache: 'no-store'});
  if (!r.ok) throw new Error('读取 GitHub 话题名单失败 HTTP ' + r.status);
  const file = await r.json();
  const list = JSON.parse(new TextDecoder().decode(b64u8(file.content || '')));
  if (!Array.isArray(list) || !file.sha) throw new Error('GitHub 话题名单格式不正确，未修改');
  return {list, sha: file.sha};
}
async function putTopics(change){
  const cur = await githubTopics();
  let list = cur.list.slice();
  if (change.add){
    if (list.some(t => String(t.ch_id) === String(change.add.ch_id))) throw new Error('主库中已存在该话题');
    list.push(change.add);
  } else if (change.removeName != null){
    /* 双平台删除（2026-11-15 用户定）：另一侧按名字清；没有同名条目就返回 null 不提交 */
    const keep = list.filter(t => t.name !== change.removeName);
    if (keep.length === list.length) return null;
    list = keep;
  } else {
    list = list.filter(t => String(t.ch_id) !== String(change.remove));
    if (list.length === cur.list.length) throw new Error('该话题已从主库移除，请刷新');
  }
  const r = await gh('/repos/' + CFG.repo + '/contents/topics.json', {
    method: 'PUT', headers: {'Content-Type': 'application/json'},
    body: JSON.stringify({message: '手机端：更新话题名单',
      content: u8b64utf8(JSON.stringify(list, null, 2) + '\n'), sha: cur.sha, branch: 'main'})
  });
  if (r.status === 409 || r.status === 422) throw new Error('主库名单已有新修改，未覆盖；请刷新后重试');
  if (!r.ok) throw new Error('提交到 GitHub 失败 HTTP ' + r.status);
  return list;
}
async function githubXhsTopics(){
  const r = await gh('/repos/' + CFG.repo + '/contents/xhs_topics.json?ref=main', {cache: 'no-store'});
  if (!r.ok) throw new Error('读取 GitHub 小红书名单失败 HTTP ' + r.status);
  const file = await r.json();
  const list = JSON.parse(new TextDecoder().decode(b64u8(file.content || '')));
  if (!Array.isArray(list) || !file.sha) throw new Error('GitHub 小红书名单格式不正确，未修改');
  return {list, sha: file.sha};
}

      content: u8b64utf8(JSON.stringify(list, null, 2) + '\n'), sha: cur.sha, branch: 'main'})
  });
  if (r.status === 409 || r.status === 422) throw new Error('小红书名单已有新修改，未覆盖；请刷新后重试');
  if (!r.ok) throw new Error('提交小红书名单到 GitHub 失败 HTTP ' + r.status);
  return list;
}
/* 一个表单、一次提交：只写缺失的平台，已有的一边跳过。 */
async function addTopicsBoth(dyAdd, xhsAdd){
  const [curDy, curXhs] = await Promise.all([githubTopics(), githubXhsTopics()]);
  const dyHas = !!(dyAdd && curDy.list.some(t => String(t.ch_id) === String(dyAdd.ch_id)));
  const xhsHas = !!(xhsAdd && curXhs.list.some(t => String(t.page_id) === String(xhsAdd.page_id)));
  let dyAdded = false, xhsAdded = false;
  if (dyAdd && !dyHas){
    await putTopics({add: dyAdd});
    dyAdded = true;
  }
  if (xhsAdd && !xhsHas){
    try{
      await putXhsTopics({add: xhsAdd});
      xhsAdded = true;
    }catch(e){
      if (dyAdded) throw new Error('抖音已提交，小红书失败：' + e.message);
      throw e;
    }
  }
  return {dyHas, xhsHas, dyAdded, xhsAdded};
}

/* ---------------- 异常分析（当天，北京时间 0 点起；与 server.py analyze 同口径同阈值，2026-11-09 定） ---------------- */
const ANOM = { z: 2.5, mult: 2, minDelta: 3e6, dropMin: 1e6,
               shortQoq: 300, shortMinDy: 1e6, shortMinXhs: 1e5, shortMinPrev: 1e4 };
function dayStartTs(){
  return Math.floor((Date.now() / 1000 + 8 * 3600) / 86400) * 86400 - 8 * 3600;
}
function medianOf(a){
  const s = a.slice().sort((x, y) => x - y);
  const m = s.length >> 1;
  return s.length % 2 ? s[m] : (s[m - 1] + s[m]) / 2;
}
function tsLabel(ts, withDate){
  const d = new Date(ts * 1000), p = n => String(n).padStart(2, '0');
  return (withDate ? (d.getMonth() + 1) + '.' + p(d.getDate()) + ' ' : '') +
    p(d.getHours()) + ':' + p(d.getMinutes());
}
/* 曲线横轴刻度只留数字（2026-11-10 用户定）：短档「12」，跨天档「11.10 12」。
   不写「时」、不带 :00；只有跨天才加日期，否则 7/30 天里同一小时会重复。
   tsLabel 仍带分钟，小时明细、异常段说明都用它，别混。 */
function xAxisLabel(ts, crossDay, dayOnly){
  return xAxisLabelCore(ts, crossDay, dayOnly, '.');
}
/* 7 天以上的长档横轴（2026-11-10 用户定）：按 24 小时一格，对齐本地每天 0 点。
   原来是 spanH/5 再翻倍，7 天档算成 34 小时一格、30 天档 144 小时（6 天）一格，
   既不对齐日期也不是整天。 */
/* dayTicks 已抽到共享 frontend_core.js */
function analyzeAnoms(){
  const D = S.data[S.pf];
  if (!D || !D.history) return null;
  const segs = [], shorts = [];
  let judged = 0, total = 0;
  for (const t of (D.topics || [])){
    const key = String(t.ch_id || t.page_id);
    const snaps = (D.history[key] || []).slice().sort((a, b) => a[0] - b[0]);
    // 短时异动先算：不要求当天已经攒够 6 个区间，上午样本少时也能抓最近一小时脉冲。
    const chain = hourlyChain(snaps);
    const hq = h1QoqOf(chain);
    const shortMin = S.pf === 'xhs' ? ANOM.shortMinXhs : ANOM.shortMinDy;
    if (hq.h1qoq != null && hq.h1qoq >= ANOM.shortQoq &&
        hq.h1 >= shortMin && Math.abs(hq.h1Prev) >= ANOM.shortMinPrev){
      shorts.push({ name: t.name || key, kind: 'short',
        start: chain[chain.length - 2][0], end: chain[chain.length - 1][0],
        delta: hq.h1, prev: hq.h1Prev, qoq: hq.h1qoq });
    }
    if (snaps.length < 8) continue;
    total++;
    const day0 = dayStartTs();
    const pts = snaps.filter(x => x[0] >= day0);
    if (pts.length < 2) continue;
    const ivs = [];
    let decline = null, anchor = pts[0];
    const flushDecline = () => {
      if (decline){
        const dd = decline[1][1] - decline[0][1];
        if (dd <= -ANOM.dropMin) segs.push({ name: t.name || key, kind: 'drop',
          start: decline[0][0], end: decline[1][0], delta: dd });
        decline = null;
      }
    };
    for (let i = 1; i < pts.length; i++){
      const b = pts[i], h = (b[0] - anchor[0]) / 3600;
      if (h < 1) continue;
      if (h > 6){ flushDecline(); anchor = b; continue; }
      const d = b[1] - anchor[1];
      if (d < 0){
        if (!decline) decline = [[anchor[0], anchor[1]], [b[0], b[1]]];
        else if (b[1] < decline[1][1]) decline[1] = [b[0], b[1]];
        continue;
      }
      if (d === 0) continue;
      flushDecline();
      ivs.push([anchor[0], b[0], d, h]);
      anchor = b;
    }
    flushDecline();
    if (ivs.length < 6) continue;
    judged++;
    const base = medianOf(ivs.map(x => x[2] / x[3]));
    if (base <= 0) continue;
    let sigma = 1.4826 * medianOf(ivs.map(x => Math.abs(x[2] / x[3] - base)));
    if (sigma <= 0) sigma = base * 0.25;
    const flagged = [];
    ivs.forEach((x, i) => {
      const r = x[2] / x[3];
      if ((r - base) / sigma >= ANOM.z && r >= base * ANOM.mult && x[2] >= ANOM.minDelta) flagged.push(i);
    });
    const groups = [];
    flagged.forEach(i => {
      const g = groups[groups.length - 1];
      if (g && i - g[g.length - 1] <= 2) g.push(i);
      else groups.push([i]);
    });
    groups.forEach(g => {
      const t1 = ivs[g[0]][0], t2 = ivs[g[g.length - 1]][1];
      segs.push({ name: t.name || key, kind: 'spike',
        start: t1, end: t2, hours: (t2 - t1) / 3600,
        delta: g.reduce((a, i) => a + ivs[i][2], 0),
        ratio: Math.max(...g.map(i => ivs[i][2] / ivs[i][3])) / base });
    });
  }
  segs.sort((a, b) => Math.abs(b.delta) - Math.abs(a.delta));
  shorts.sort((a, b) => b.qoq - a.qoq);
  return { segs, judged, total, shorts,
    shortRule: { qoq: ANOM.shortQoq,
      min_delta: S.pf === 'xhs' ? ANOM.shortMinXhs : ANOM.shortMinDy,
      min_prev: ANOM.shortMinPrev } };
}
function openAnoms(){
  const r = analyzeAnoms();
  if (!r){ toast('还没有数据', true); return; }
  const items = r.segs.map(x => `
    <div class="arow">
      <span class="nm"><b>${stEsc(x.name)}</b>
        <em>${x.kind === 'drop' ? '数据倒扣' : '疑似注水'} · ${x.kind === 'spike' ? '峰值 ' + x.ratio.toFixed(1) + ' 倍 · ' : ''}${tsLabel(x.start, true)} ~ ${tsLabel(x.end, true)}</em></span>
      <span class="vv"><b class="num ${x.delta < 0 ? 'down' : 'up'}">${fmtWanDelta(x.delta)}</b></span>
    </div>`).join('');
  const shortRows = (r.shorts || []).map(x => `
    <div class="arow">
      <span class="nm"><b>${stEsc(x.name)}</b>
        <em>短时异动 · ${tsLabel(x.start, true)} ~ ${tsLabel(x.end, true)} · 1h环比 +${x.qoq.toFixed(0)}%</em></span>
      <span class="vv"><b class="num up">${fmtWanDelta(x.delta)}</b></span>
    </div>`).join('');
  openSheet('异常分析（今天） · ' + (S.pf === 'xhs' ? '小红书' : '抖音'), `
    <p class="hint">分析 ${r.judged}/${r.total} 个话题 · 可疑时段 ${r.segs.length} 段 · 短时异动 ${r.shorts.length} 段。
      「疑似注水」= 该话题自身增速基线的统计离群（≥2 倍 + z≥2.5 + 段增量 ≥ 300 万）；
      「数据倒扣」= 累计值不增反减且超过 100 万。
      「短时异动」= 最近一小时环比 ≥300%，且本小时增量 ≥ ${fmtWanDelta(r.shortRule.min_delta).replace(/^\+/, '')}（不要求攒够 6 个区间）。只做统计判断，不下结论。</p>
    ${items || '<p class="hint">今天还没有持续可疑时段。</p>'}
    ${shortRows ? '<p class="hint" style="margin-top:14px"><b>短时异动</b></p>' + shortRows : ''}`);
}

/* ===== 数据工作台入口（独立增量，不改动任何现有函数与状态） =====
   App 已经把全量 history.json.gz 读进内存，不需要额外网络请求。 */
(function(){
  const btn = document.getElementById('btnLab');
  if(!btn) return;
  function loadData(){
    const d = D(), pf = S.pf, byId = {};
    for(const t of (d.topics || [])) byId[String(t.ch_id || t.page_id || '')] = t;
    const series = Object.keys(d.history || {}).map(id => {
      const t = byId[id] || {};
      return {id, name:t.name || id, cat:t.category || '',
        cats:t.categories || [t.category || '未分类'], points:d.history[id] || [],
        discussPoints:(d.discuss || {})[id] || []};
    });
    let now = 0;
    for(const s of series) for(const p of s.points) if(p && p[0] > now) now = p[0];
    return {platform:pf, label:pf === 'xhs' ? '小红书' : '抖音',
      unit:pf === 'xhs' ? '浏览量' : '播放量',
      secondaryLabel:pf === 'xhs' ? '笔记数' : '参与人数',
      focusId:String(S.sel || ''), rows:d.rows || [], series,
      now: now || Math.floor(Date.now() / 1000)};
  }
  btn.onclick = () => {
    openSheet('话题数据详情', '<div id="wbRoot"></div>');
    const root = document.getElementById('wbRoot');
    try{ labMount(root, loadData()); }
    catch(e){ root.innerHTML = '<div class="labx-empty">' + stEsc(e.message || '数据不可用') + '</div>'; }
  };
})();
